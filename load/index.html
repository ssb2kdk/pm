<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>설비별 부하 모니터링</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="../config.js"></script>
  <script src="../common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    :root { --primary: #1a1a1a; --bg: #f5f5f5; --card: #fff; --border: #e0e0e0; --text: #1a1a1a; --muted: #888;
      --teal: #1D9E75; --teal-bg: #E1F5EE; --amber: #BA7517; --amber-bg: #FAEEDA; --red: #A32D2D; --red-bg: #FCEBEB; --blue: #185FA5; --blue-bg: #E6F1FB; --radius: 12px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    [hidden] { display: none !important; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 12px; }
    .head { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 0; position: sticky; top: 0; z-index: 10; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title { font-size: 17px; font-weight: 700; }
    .vtabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .vtab { font-size: 13px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--muted); cursor: pointer; }
    .vtab.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 12px 0 4px; }
    .chip { font-size: 12px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); cursor: pointer; color: #444; }
    .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .bar input[type=date] { font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
    .hint { font-size: 12px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; margin: 10px 0 40px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .card h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
    .card h3 .st { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 10px; background: var(--teal-bg); color: var(--teal); }
    .card h3 .st.off { background: #eee; color: var(--muted); }
    .card .when { font-size: 11px; color: var(--muted); margin-left: auto; font-weight: 400; }
    .chs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .ch { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
    .ch.over { border-color: var(--red); background: var(--red-bg); }
    .ch.warn { border-color: var(--amber); background: var(--amber-bg); }
    .ch .nm { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ch .a { font-size: 24px; font-weight: 700; margin-top: 2px; } .ch .a small { font-size: 12px; font-weight: 400; color: var(--muted); }
    .ch.over .a { color: var(--red); }
    .ch .kw { font-size: 12px; color: #555; }
    .ch .lim { height: 4px; background: #eee; border-radius: 2px; margin-top: 6px; overflow: hidden; } .ch .lim i { display: block; height: 100%; background: var(--teal); }
    .ch.warn .lim i { background: var(--amber); } .ch.over .lim i { background: var(--red); }
    .ch .lt { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .mini { height: 120px; margin-top: 10px; position: relative; }
    .big { height: 300px; position: relative; margin-top: 8px; }
    .zoomable { cursor: zoom-in; }
    .zm-ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 12px; }
    .zm-box { background: #fff; border-radius: var(--radius); width: min(1400px, 100%); max-height: 100%; overflow: auto; padding: 14px 16px; }
    .zm-box .zc { height: 62vh; min-height: 280px; position: relative; margin-top: 8px; }
    .zm-box input[type=date], .zm-box input[type=time] { font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; }
    .zm-x { margin-left: auto; font-size: 20px; background: none; border: none; cursor: pointer; color: #555; }
    table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
    table.t th, table.t td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: right; white-space: nowrap; }
    table.t th { background: #fafafa; font-weight: 600; color: #555; position: sticky; top: 0; }
    table.t .l { text-align: left; }
    table.t tr.sum td { font-weight: 700; background: #f6f8fb; }
    .tbl-wrap { overflow: auto; max-height: 560px; margin-top: 8px; border: 1px solid #eee; border-radius: 8px; }
    .over-t { color: var(--red); font-weight: 700; }
    .set input, .set select { font-size: 13px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 6px; width: 100%; }
    .set td { padding: 4px 6px; }
    .btn { padding: 9px 18px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn.sec { background: #fff; color: #333; border: 1px solid var(--border); }
    .loading, .empty { padding: 30px; text-align: center; color: var(--muted); font-size: 14px; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50; }
    .toast.show { opacity: 1; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .ch .a { font-size: 20px; } }
  </style>
</head>
<body>
  <div id="app" hidden>
    <div class="head"><div class="wrap head-row">
      <div class="title">⚡ 설비별 부하 모니터링</div>
      <div class="vtabs">
        <button class="vtab on" data-v="now">실시간</button>
        <button class="vtab" data-v="trend">기간 그래프</button>
        <button class="vtab" data-v="kwh">전력량 (kWh)</button>
        <button class="vtab" data-v="run">가동시간</button>
        <button class="vtab" data-v="set">설정</button>
      </div>
    </div></div>
    <div class="wrap" id="body"><div class="loading">불러오는 중...</div></div>
    <div class="toast" id="toast"></div>
    <div class="zm-ov" id="zm" hidden onclick="if(event.target===this)zmClose()"><div class="zm-box" id="zm-box"></div></div>
  </div>
<script>
let sb = null, PANELS = [], CH = {}, LATEST = {}, view = 'now', nowHours = 6, timer = null, charts = {};
let trFrom = null, trTo = null, trPanel = null, kwFrom = null, kwTo = null, rnFrom = null, rnTo = null, ASSIGN = [];
const COLORS = ['#2a78d6', '#e5534b', '#1D9E75'];
const p2 = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('sv-SE');
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const kst = (s, t) => new Date(s + 'T' + (t || '00:00') + ':00+09:00');
const hm = d => p2(d.getHours()) + ':' + p2(d.getMinutes());
const f1 = v => v === null || v === undefined || isNaN(v) ? '-' : Number(v).toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const f0 = v => v === null || v === undefined || isNaN(v) ? '-' : Math.round(v).toLocaleString('ko-KR');
const isAdmin = () => Portal.isAdmin();
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
const kwF = c => (c = c || {}, Number(c.phase) === 1 ? 1 : Math.sqrt(3)) * (Number(c.voltage) || 380) * (Number(c.pf) || 0.85) / 1000; // A → kW
const chName = (pid, i) => (CH[pid] && CH[pid][i] && CH[pid][i].name) || ('CH' + i);
// 측정 이력: 그 날짜에 이 채널이 재던 설비 이름 (이력 없으면 지금 이름)
const asgAt = (pid, i, d) => ASSIGN.find(a => a.panel_id === pid && Number(a.ch) === i && a.d_from <= d && (!a.d_to || a.d_to >= d));
const nameAt = (pid, i, d) => { const a = asgAt(pid, i, d); return a ? a.name : chName(pid, i); };
function nameRange(pid, i, f, t) { const out = []; for (let d = f; d <= t; d = addDays(d, 1)) { const n = nameAt(pid, i, d); if (out[out.length - 1] !== n) out.push(n); if (out.length > 3) break; } return out.join(' → '); }

async function loadConfig() {
  const [p, c] = await Promise.all([sb.from('load_panels').select('*').order('ord'), sb.from('load_channels').select('*')]);
  if (p.error) throw p.error; if (c.error) throw c.error;
  PANELS = p.data || []; CH = {};
  (c.data || []).forEach(x => { (CH[x.panel_id] = CH[x.panel_id] || [])[x.ch] = x; });
  const a = await sb.from('load_assign').select('*').order('d_from'); ASSIGN = a.error ? [] : (a.data || []);
}
async function loadLatest() { const { data, error } = await sb.rpc('load_latest'); if (error) throw error; LATEST = {}; (data || []).forEach(r => { LATEST[r.panel_id] = r; }); }
async function series(from, to, bucket) { // 1,000건씩 이어서 가져옴
  const out = {}; let f = from;
  for (let g = 0; g < 300; g++) {
    const { data, error } = await sb.rpc('load_series', { p_from: f.toISOString(), p_to: to.toISOString(), p_bucket: bucket }).range(0, 999);
    if (error) throw error;
    (data || []).forEach(r => (out[r.panel_id] = out[r.panel_id] || []).push(r));
    if (!data || data.length < 1000) break; f = new Date(new Date(data[data.length - 1].ts).getTime() + 1);
  }
  return out;
}
// 하루 요약(29번 SQL) → 채널별 하루 kWh. kWh = A·분 × kW계수 ÷ 60
async function dayRows(from, to) {
  let rows = [];
  for (let o = 0; o < 30; o++) { const { data, error } = await sb.rpc('load_day_get', { p_from: from, p_to: to }).range(o * 1000, o * 1000 + 999); if (error) throw error; rows = rows.concat(data || []); if (!data || data.length < 1000) break; }
  return rows.map(r => ({ ...r, kwh: Number(r.amin || 0) * kwF((CH[r.panel_id] || [])[r.ch]) / 60 }));
}
function mk(id, cfg) { if (charts[id]) charts[id].destroy(); const el = document.getElementById(id); if (!el) return; charts[id] = new Chart(el, cfg); }
function lineCfg(rows, pid, unit, names) {
  return { type: 'line', data: { labels: rows.map(r => r.ts), datasets: [0, 1, 2].map(i => ({ label: names ? names[i] : chName(pid, i), data: rows.map(r => r['ch' + i]), borderColor: COLORS[i], backgroundColor: COLORS[i], borderWidth: 1.5, pointRadius: 0, tension: 0.2, spanGaps: false })) },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { labels: { boxWidth: 10, font: { size: 11 } } }, tooltip: { callbacks: { title: it => { const r = rows[it[0].dataIndex]; if (!r) return ''; const d = new Date(r.ts); return `${d.getMonth() + 1}/${d.getDate()} ${hm(d)}`; }, label: c => ` ${c.dataset.label}: ${f1(c.raw)} ${unit}` } } },
      scales: { x: { type: 'category', ticks: { maxTicksLimit: 8, font: { size: 10 }, callback: v => { const r = rows[v]; if (!r) return ''; const x = new Date(r.ts); return (rows.length > 600 ? `${x.getMonth() + 1}/${x.getDate()} ` : '') + hm(x); } } }, y: { beginAtZero: true, title: { display: true, text: unit, font: { size: 11 } } } } } };
}

// ---------------- 실시간 ----------------
async function renderNow() {
  const el = document.getElementById('body');
  try { await loadLatest(); } catch (e) { el.innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message || e)}</div>`; return; }
  const now = Date.now();
  let h = `<div class="bar"><span class="hint">그래프</span>${[[3, '3시간'], [6, '6시간'], [24, '24시간']].map(([n, t]) => `<button class="chip ${nowHours === n ? 'on' : ''}" onclick="nowHours=${n};renderNow()">${t}</button>`).join('')}
    <span class="hint" style="margin-left:auto">1분마다 자동 새로고침 · ${hm(new Date())}</span></div><div class="grid">`;
  PANELS.forEach(p => {
    const r = LATEST[p.id], age = r ? (now - new Date(r.ts)) / 60000 : null, live = age !== null && age <= 3;
    h += `<div class="card"><h3>${esc(p.name)} <span class="st ${live ? '' : 'off'}">${live ? '수신 중' : r ? '끊김' : '기록 없음'}</span><span class="when">${r ? (age < 60 ? `${Math.round(age)}분 전` : new Date(r.ts).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })) : ''}</span></h3><div class="chs">` +
      [0, 1, 2].map(i => { const c = (CH[p.id] || [])[i] || {}, a = r ? r['ch' + i] : null, lim = Number(c.limit_a) || 0, pct = lim && a !== null ? a / lim * 100 : null;
        const cls = pct === null ? '' : pct >= 100 ? 'over' : pct >= 85 ? 'warn' : '';
        return `<div class="ch ${cls}"><div class="nm" title="${esc(chName(p.id, i))}">${esc(chName(p.id, i))}</div><div class="a">${a === null || a === undefined ? '-' : f1(a)} <small>A</small></div><div class="kw">${a === null || a === undefined ? '' : f1(a * kwF(c)) + ' kW'}</div>
          ${lim ? `<div class="lim"><i style="width:${Math.min(100, pct || 0)}%"></i></div><div class="lt">기준 ${f0(lim)} A · ${pct === null ? '-' : f0(pct) + '%'}</div>` : '<div class="lt">기준 미설정</div>'}</div>`; }).join('') +
      `</div><div class="mini"><canvas id="m-${p.id}"></canvas></div></div>`;
  });
  el.innerHTML = backupBanner() + h + '</div>';
  const to = new Date(), from = new Date(to.getTime() - nowHours * 3600000);
  try { const S = await series(from, to, nowHours <= 6 ? 1 : 5); PANELS.forEach(p => { mk('m-' + p.id, lineCfg(S[p.id] || [], p.id, 'A')); zoomable('m-' + p.id, p.id, from, to); }); } catch (e) { }
  clearTimeout(timer); timer = setTimeout(() => { if (view === 'now') renderNow(); }, 60000);
}

// ---------------- 기간 그래프 ----------------
function rangeBar(kind) {
  const f = { tr: trFrom, kw: kwFrom, rn: rnFrom }[kind], t = { tr: trTo, kw: kwTo, rn: rnTo }[kind], d = today();
  const pre = kind === 'tr' ? [['오늘', d, d], ['어제', addDays(d, -1), addDays(d, -1)], ['최근 7일', addDays(d, -6), d], ['최근 30일', addDays(d, -29), d]]
    : [['오늘', d, d], ['이번 달', d.slice(0, 8) + '01', d], ['지난달', (() => { const x = new Date(d.slice(0, 8) + '01T00:00:00'); x.setMonth(x.getMonth() - 1); return x.toLocaleDateString('sv-SE'); })(), addDays(d.slice(0, 8) + '01', -1)], ['최근 7일', addDays(d, -6), d], ['최근 30일', addDays(d, -29), d]];
  return `<div class="bar">${pre.map(([n, a, b]) => `<button class="chip ${f === a && t === b ? 'on' : ''}" onclick="setRange('${kind}','${a}','${b}')">${n}</button>`).join('')}
    <input type="date" value="${f}" onchange="setRange('${kind}',this.value,null)"> ~ <input type="date" value="${t}" onchange="setRange('${kind}',null,this.value)"></div>`;
}
function setRange(kind, a, b) {
  if (kind === 'tr') { if (a) trFrom = a; if (b) trTo = b; if (trTo < trFrom) trTo = trFrom; renderTrend(); }
  else if (kind === 'rn') { if (a) rnFrom = a; if (b) rnTo = b; if (rnTo < rnFrom) rnTo = rnFrom; renderRun(); }
  else { if (a) kwFrom = a; if (b) kwTo = b; if (kwTo < kwFrom) kwTo = kwFrom; renderKwh(); } }
async function renderTrend() {
  const el = document.getElementById('body'); if (!trPanel) trPanel = PANELS[0] && PANELS[0].id;
  el.innerHTML = rangeBar('tr') + `<div class="bar">${PANELS.map(p => `<button class="chip ${trPanel === p.id ? 'on' : ''}" onclick="trPanel='${p.id}';renderTrend()">${esc(p.name)}</button>`).join('')}</div><div class="loading">불러오는 중...</div>`;
  const days = (kst(trTo) - kst(trFrom)) / 864e5 + 1, bucket = (trFrom === today() && trTo === today()) ? 1 : days <= 14 ? 10 : 30; // 오늘만 1분, 지난 기간은 10분 요약
  let S; try { S = await series(kst(trFrom), new Date(kst(trTo).getTime() + 864e5), bucket); } catch (e) { el.querySelector('.loading').textContent = '불러오기 실패: ' + (e.message || e); return; }
  const rows = S[trPanel] || [], p = PANELS.find(x => x.id === trPanel) || {}, cs = CH[trPanel] || [];
  const st = i => { const v = rows.map(r => r['ch' + i]).filter(x => x !== null && x !== undefined); if (!v.length) return null; const mx = Math.max(...v), at = rows.find(r => r['ch' + i] === mx);
    const lim = Number((cs[i] || {}).limit_a) || 0; return { mx, at, avg: v.reduce((a, b) => a + b, 0) / v.length, over: lim ? v.filter(x => x >= lim).length * bucket : 0, lim }; };
  const T = [0, 1, 2].map(st), NM = [0, 1, 2].map(i => nameRange(trPanel, i, trFrom, trTo));
  el.querySelector('.loading').outerHTML = `<div class="card"><h3>${esc(p.name || '')} <span class="when">${trFrom} ~ ${trTo} · ${bucket}분마다 최댓값 · 그래프를 누르면 크게</span></h3>
    ${rows.length ? `<div class="big"><canvas id="c-trend"></canvas></div>
    <table class="t" style="margin-top:10px"><tr><th class="l">채널</th><th>최대 전류</th><th>최대 시각</th><th>평균 전류</th><th>평균 kW</th><th>기준</th><th>기준 넘은 시간</th></tr>` +
      T.map((o, i) => `<tr><td class="l"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${COLORS[i]};margin-right:6px"></i>${esc(NM[i])}</td><td class="${o && o.lim && o.mx >= o.lim ? 'over-t' : ''}">${o ? f1(o.mx) + ' A' : '-'}</td><td>${o && o.at ? new Date(o.at.ts).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-'}</td><td>${o ? f1(o.avg) + ' A' : '-'}</td><td>${o ? f1(o.avg * kwF(cs[i])) : '-'}</td><td>${o && o.lim ? f0(o.lim) + ' A' : '-'}</td><td class="${o && o.over ? 'over-t' : ''}">${o && o.lim ? (o.over ? `약 ${o.over}분` : '없음') : '-'}</td></tr>`).join('') + '</table>' : '<div class="empty">이 기간 기록이 없습니다.</div>'}</div>`;
  if (rows.length) { mk('c-trend', lineCfg(rows, trPanel, 'A', NM)); zoomable('c-trend', trPanel, kst(trFrom), new Date(kst(trTo).getTime() + 864e5)); }
}

// ---------------- 전력량 (kWh) ----------------
// ---------------- 데이터 누락 (정전·쉘리 꺼짐·인터넷) ----------------
async function loadGaps(from, to) {
  const G = {}; let rows = [];
  for (let o = 0; o < 10; o++) { const { data, error } = await sb.from('load_gap').select('*').gte('d', from).lte('d', to).order('g_from').range(o * 1000, o * 1000 + 999); if (error) return { G, rows: [], err: true }; rows = rows.concat(data || []); if (!data || data.length < 1000) break; }
  rows.forEach(g => (G[g.d + '|' + g.panel_id] = G[g.d + '|' + g.panel_id] || []).push(g));
  return { G, rows };
}
const gapTxt = gs => gs.map(g => `${hm(new Date(g.g_from))}~${hm(new Date(g.g_to))} (${g.minutes}분)`).join(', ');
const gapMark = (G, d, pid) => { const gs = G[d + '|' + pid]; if (!gs) return ''; const m = gs.reduce((a, g) => a + g.minutes, 0); return ` <span style="color:var(--red);font-size:11px" title="기록 누락: ${esc(gapTxt(gs))}">⚠${m >= 60 ? (m / 60).toFixed(1) + 'h' : m + '분'}</span>`; };
function gapCard(GG, from, to) {
  if (GG.err) return '<div class="hint" style="margin-top:8px">⚠ 누락 구간을 보려면 31번 SQL을 실행해 주세요.</div>';
  const rows = GG.rows; if (!rows.length) return `<div class="card" style="margin-top:10px"><h3>✅ 데이터 누락 없음 <span class="when">${from} ~ ${to} · 5분 넘게 기록이 빈 구간 없음</span></h3></div>`;
  const tot = {}; rows.forEach(g => { tot[g.panel_id] = (tot[g.panel_id] || 0) + g.minutes; });
  const pn = id => esc((PANELS.find(p => p.id === id) || {}).name || id), dur = m => m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`;
  return `<div class="card" style="margin-top:10px;border-color:var(--red)"><h3>⚠ 데이터 누락 구간 <span class="when">정전·쉘리 꺼짐·인터넷 문제 등으로 기록이 5분 넘게 빈 시간 — 이 시간은 kWh·가동시간에 안 들어감</span></h3>
    <div class="bar">${Object.entries(tot).map(([id, m]) => `<span class="chip" style="cursor:default;border-color:var(--red);color:var(--red)">${pn(id)} 합계 ${dur(m)}</span>`).join('')}</div>
    <div class="tbl-wrap" style="max-height:300px"><table class="t"><tr><th class="l">날짜</th><th class="l">분전반</th><th class="l">언제부터</th><th class="l">언제까지</th><th>빠진 시간</th></tr>` +
    rows.map(g => `<tr><td class="l">${g.d}</td><td class="l">${pn(g.panel_id)}</td><td class="l">${new Date(g.g_from).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td><td class="l">${new Date(g.g_to).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td><td>${dur(g.minutes)}</td></tr>`).join('') + `</table></div>
    <div class="hint" style="margin-top:4px">· 같은 시각에 여러 분전반이 같이 빠졌으면 정전·인터넷, 한 분전반만 빠졌으면 그 쉘리 문제일 가능성이 큽니다.</div></div>`;
}

  const days = [...new Set(rows.map(r => r.d))].sort(), key = (p, c) => p + '|' + c, M = {};

async function saveSet() {
  try {
    for (const p of SET.panels) { const { error } = await sb.from('load_panels').update({ name: p.name || p.id, ord: p.ord || 0 }).eq('id', p.id); if (error) throw error; }

    const { error } = await sb.from('load_channels').upsert(rows, { onConflict: 'panel_id,ch' }); if (error) throw error;

async function addAssign() {
  const v = id => document.getElementById(id).value.trim();

  if (!row.d_from || !row.name) { alert('시작 날짜와 설비 이름을 넣어 주세요'); return; }
  if (row.d_to && row.d_to < row.d_from) { alert('끝 날짜가 시작보다 빠릅니다'); return; }
  const { error } = await sb.from('load_assign').insert(row); if (error) { alert('저장 실패: ' + error.message + '\n(28번 SQL을 실행했는지 확인)'); return; }

}
async function delAssign(id) {
  if (!confirm('이 측정 이력을 지울까요?')) return;
  const { error } = await sb.from('load_assign').delete().eq('id', id); if (error) { alert('삭제 실패: ' + error.message); return; }

}
// 채널별 하루 kWh를 색으로 — 갑자기 크게 바뀐 날(쉘리를 옮긴 날 후보)을 표시
async function findChanges() {
  const el = document.getElementById('chg-body'); if (!el || el.dataset.done) return;
  const to = today(), from = addDays(to, -180); let rows = [];
  try { rows = await dayRows(from, to); }
  catch (e) { el.innerHTML = '불러오기 실패: ' + esc(e.message || e) + '<br>Supabase에 29번 SQL(29_load_daily.sql)을 실행했는지 확인해 주세요.'; return; }
  const days = [...new Set(rows.map(r => r.d))].sort(), M = {}; rows.forEach(r => { M[r.d + '|' + r.panel_id + '|' + r.ch] = Number(r.kwh) || 0; });
  const cols = []; PANELS.forEach(p => [0, 1, 2].forEach(c => cols.push({ p, c })));
  const mx = cols.map(o => Math.max(1, ...days.map(d => M[d + '|' + o.p.id + '|' + o.c] || 0)));
  // 앞뒤 7일 평균이 2배 넘게(또는 절반 아래로) 바뀐 날 = 변화 후보
  const avg = (o, a, b) => { const v = []; for (let i = a; i < b; i++) if (days[i]) v.push(M[days[i] + '|' + o.p.id + '|' + o.c] || 0); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
  const cand = [];
  cols.forEach((o, j) => { let last = -99; days.forEach((d, i) => { if (i < 7 || i > days.length - 7) return; const b = avg(o, i - 7, i), a = avg(o, i, i + 7); if (b === null || a === null) return; const hi = Math.max(a, b), lo = Math.max(Math.min(a, b), mx[j] * 0.03);
    if (hi / lo >= 2 && hi > mx[j] * 0.15 && i - last > 7) { cand.push({ d, o, b, a }); last = i; } }); });
  el.dataset.done = 1; el.className = '';
  el.innerHTML = (cand.length ? `<div style="margin:8px 0"><b style="font-size:13px">변화 후보</b> <span class="hint">(앞 7일과 뒤 7일 평균이 2배 넘게 차이 나는 날 — 설비를 옮겼거나, 설비 가동이 바뀐 날)</span><ul style="margin:4px 0;padding-left:18px;font-size:13px">${cand.map(c => `<li>${c.d} · ${esc(c.o.p.name)} CH${c.o.c} (${esc(chName(c.o.p.id, c.o.c))}) — 하루 ${f0(c.b)} → ${f0(c.a)} kWh</li>`).join('')}</ul></div>` : '<div class="hint" style="margin:8px 0">뚜렷한 변화 후보는 없습니다.</div>') +
    `<div class="tbl-wrap" style="max-height:420px"><table class="t"><tr><th class="l">날짜</th>${cols.map(o => `<th>${esc(o.p.name)}<br><span class="hint">${esc(chName(o.p.id, o.c))}</span></th>`).join('')}</tr>` +
    days.map(d => `<tr><td class="l">${d.slice(2).replace(/-/g, '/')}</td>${cols.map((o, j) => { const v = M[d + '|' + o.p.id + '|' + o.c] || 0, r = v / mx[j]; return `<td style="background:rgba(24,95,165,${(r * 0.85).toFixed(2)});color:${r > 0.55 ? '#fff' : '#333'}">${f0(v)}</td>`; }).join('')}</tr>`).join('') + '</table></div><div class="hint">색이 진할수록 그 채널 최대치에 가까움 (단위 kWh/일). 색이 갑자기 바뀌는 곳이 옮긴 날 후보입니다.</div>';
}

// ---------------- 그래프 크게 보기 (누르면 열림 · 시간 조절 · 드래그 확대) ----------------
let ZM = null;
try { if (window.ChartZoom) Chart.register(window.ChartZoom); } catch (e) { }
function zoomable(id, pid, from, to) { const c = document.getElementById(id); if (!c) return; c.classList.add('zoomable'); c.title = '누르면 크게 보기'; c.onclick = () => zmOpen(pid, from, to); }
const zmBucket = (f, t) => { const h = (t - f) / 36e5, td = kst(today()); if (f >= td) return h <= 3 ? 1 : h <= 12 ? 2 : 5; return h <= 30 ? 10 : h <= 24 * 14 ? 10 : 30; };
const dstr = d => d.toLocaleDateString('sv-SE'), tstr = d => hm(d);
function zmOpen(pid, from, to) { ZM = { pid, from: new Date(from), to: new Date(to), base: [new Date(from), new Date(to)] }; document.getElementById('zm').hidden = false; document.addEventListener('keydown', zmKey); zmLoad(); }
function zmClose() { document.getElementById('zm').hidden = true; document.removeEventListener('keydown', zmKey); if (charts['zm-c']) { charts['zm-c'].destroy(); delete charts['zm-c']; } ZM = null; }
function zmKey(e) { if (e.key === 'Escape') zmClose(); }
function zmSet(from, to) { if (to <= from) return; const now = new Date(); if (to > now) to = now; ZM.from = from; ZM.to = to; zmLoad(); }
function zmLast(h) { const to = new Date(); zmSet(new Date(to.getTime() - h * 36e5), to); }
function zmShift(dir) { const sp = ZM.to - ZM.from; zmSet(new Date(ZM.from.getTime() + dir * sp), new Date(ZM.to.getTime() + dir * sp)); }
function zmInputs() { const v = id => document.getElementById(id).value; const f = new Date(v('zm-fd') + 'T' + (v('zm-ft') || '00:00') + ':00'), t = new Date(v('zm-td') + 'T' + (v('zm-tt') || '00:00') + ':00'); if (isNaN(f) || isNaN(t) || t <= f) { alert('시작이 끝보다 빨라야 합니다'); return; } zmSet(f, t); }
async function zmLoad() {
  const p = PANELS.find(x => x.id === ZM.pid) || {}, b = zmBucket(ZM.from, ZM.to), box = document.getElementById('zm-box');
  box.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><b style="font-size:16px">${esc(p.name || '')}</b><span class="hint">${b}분마다 최댓값${ZM.from < kst(today()) ? ' · 지난 날은 10분 요약' : ''}</span><button class="zm-x" onclick="zmClose()">✕</button></div>
    <div class="bar">${[[1, '1시간'], [3, '3시간'], [6, '6시간'], [12, '12시간'], [24, '24시간'], [72, '3일'], [168, '7일']].map(([h, t]) => `<button class="chip" onclick="zmLast(${h})">최근 ${t}</button>`).join('')}</div>
    <div class="bar"><button class="chip" onclick="zmShift(-1)">◀ 이전</button>
      <input type="date" id="zm-fd" value="${dstr(ZM.from)}"><input type="time" id="zm-ft" value="${tstr(ZM.from)}"> ~ <input type="date" id="zm-td" value="${dstr(ZM.to)}"><input type="time" id="zm-tt" value="${tstr(ZM.to)}">
      <button class="chip on" onclick="zmInputs()">보기</button><button class="chip" onclick="zmShift(1)">다음 ▶</button>
      <button class="chip" style="margin-left:auto" onclick="zmSet(ZM.base[0], ZM.base[1])">처음 범위로</button></div>
    <div class="zc"><canvas id="zm-c"></canvas><div class="loading" id="zm-ld" style="position:absolute;inset:0;background:rgba(255,255,255,.7)">불러오는 중...</div></div>
    <div class="hint" style="margin-top:6px">· 그래프 위에서 <b>마우스로 끌면</b> 그 구간만 확대 (더 촘촘한 간격으로 다시 불러옴) · 마우스 휠로 확대/축소 · Shift+끌기로 좌우 이동 · Esc 또는 바깥을 누르면 닫힘</div>
    <div id="zm-st" style="margin-top:6px"></div>`;
  let S; try { S = await series(ZM.from, ZM.to, b); } catch (e) { document.getElementById('zm-ld').textContent = '불러오기 실패: ' + (e.message || e); return; }
  if (!ZM) return;
  const rows = S[ZM.pid] || [], d0 = dstr(ZM.from), d1 = dstr(new Date(ZM.to.getTime() - 1)), NM = [0, 1, 2].map(i => nameRange(ZM.pid, i, d0, d1));
  document.getElementById('zm-ld').remove();
  if (!rows.length) { document.querySelector('#zm-box .zc').innerHTML = '<div class="empty">이 구간 기록이 없습니다.</div>'; return; }
  const cfg = lineCfg(rows, ZM.pid, 'A', NM);
  if (window.ChartZoom || (Chart.registry && Chart.registry.plugins.get('zoom'))) {
    cfg.options.plugins.zoom = { zoom: { drag: { enabled: true, backgroundColor: 'rgba(24,95,165,.15)' }, wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x',
      onZoomComplete: ({ chart }) => { const sx = chart.scales.x, i0 = Math.max(0, Math.floor(sx.min)), i1 = Math.min(rows.length - 1, Math.ceil(sx.max)); if (i1 - i0 < 2) return;
        const f = new Date(rows[i0].ts), t = new Date(new Date(rows[i1].ts).getTime() + b * 60000); if (zmBucket(f, t) < b) { clearTimeout(ZM.tm); ZM.tm = setTimeout(() => zmSet(f, t), 400); } } },
      pan: { enabled: true, mode: 'x', modifierKey: 'shift' } };
  }
  mk('zm-c', cfg);
  const cs = CH[ZM.pid] || [];
  document.getElementById('zm-st').innerHTML = '<table class="t"><tr><th class="l">채널</th><th>최대</th><th>최대 시각</th><th>평균</th><th>기준</th></tr>' + [0, 1, 2].map(i => { const v = rows.map(r => r['ch' + i]).filter(x => x !== null && x !== undefined); if (!v.length) return ''; const mx = Math.max(...v), at = rows.find(r => r['ch' + i] === mx), lim = Number((cs[i] || {}).limit_a) || 0;
    return `<tr><td class="l"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${COLORS[i]};margin-right:6px"></i>${esc(NM[i])}</td><td class="${lim && mx >= lim ? 'over-t' : ''}">${f1(mx)} A</td><td>${new Date(at.ts).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td><td>${f1(v.reduce((a, c) => a + c, 0) / v.length)} A</td><td>${lim ? f0(lim) + ' A' : '-'}</td></tr>`; }).join('') + '</table>';
}

// ---------------- 오래된 기록 정리·백업 (관리자) ----------------
function compactHtml() {
  const d = today(), ms = []; for (let i = 0; i < 12; i++) { const x = new Date(d.slice(0, 8) + '01T00:00:00'); x.setMonth(x.getMonth() - i); ms.push(x.toLocaleDateString('sv-SE').slice(0, 7)); }
  return `<div class="card" style="margin-top:14px"><h3>🗜️ 오래된 기록 정리 · 백업 <span class="when">용량 줄이기</span></h3>
    <div class="hint" style="margin:6px 0">· <b>오늘</b>만 1분 기록 그대로, 지난 날은 <b>10분마다 최댓값·평균값</b>만 남깁니다 (용량 약 1/7). 매일 새벽 3시 30분에 어제 치가 자동으로 정리됩니다.<br>
    · 정리하기 전에 그날 <b>kWh와 가동시간을 1분 기록으로 계산해 보관</b>합니다 → 숫자는 1분 단위 그대로. (가동 기준을 나중에 바꾸면 지난 날 가동시간은 10분 평균으로 다시 계산되니, 가동 기준은 먼저 넣어 두세요)<br>
    · 지우기 전에 그날 kWh를 1분 기록으로 정확히 계산해 두므로 <b>전력량(kWh)은 그대로</b>, 기간 그래프는 오래된 날이 10분 단위(최댓값)로 보입니다.<br>
    · <b>1분 기록 원본은 하루 1줄로 압축해서 자동 보관</b>됩니다 (손실 없음, 1년 약 30~40 MB) → 아래에서 아무 달이나 1분 기록 CSV로 받을 수 있습니다 (엑셀로 열림).<br>
    · 회사 PC에도 따로 두려면 매달 초 이 화면에 뜨는 「지난달 백업 받기」를 눌러 주세요.</div>
    <div class="bar"><select id="cv-m" style="font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:8px">${ms.map(m => `<option>${m}</option>`).join('')}</select>
      <button class="chip" onclick="csvMonth()">⬇ 이 달 기록 CSV 받기</button>
      <button class="chip" style="margin-left:auto" onclick="compactNow()">🗜️ 지금 정리하기</button></div>
    <div class="hint" id="cv-st"></div></div>`;
}
async function csvMonth(mm) {
  const m = mm || document.getElementById('cv-m').value, st = document.getElementById('cv-st') || document.getElementById('bk-st') || { set textContent(v) {} }; let out = ['날짜,시간,분전반ID,CH0(A),CH1(A),CH2(A),CH0평균,CH1평균,CH2평균,구분(1분 값 / 10분 최댓값)'], n = 0;
  for (let d = m + '-01'; d.slice(0, 7) === m && d <= today(); d = addDays(d, 1)) {
    st.textContent = `${d} 받는 중...`;
    const { data, error } = await sb.rpc('load_csv', { p_d: d }); if (error) { st.textContent = '실패: ' + error.message + ' (30번 SQL 실행 확인)'; return; }
    if (data) { out.push(data); n += data.split('\n').length; }
  }
  if (!n) { st.textContent = `${m}: 기록이 없습니다.`; return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + out.join('\n')], { type: 'text/csv' })); a.download = `설비부하_${m}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  st.textContent = `${m}: ${n.toLocaleString()}줄 받았습니다.`;
  try { localStorage.setItem('load-bk-' + m, '1'); } catch (e) { }
}
async function compactNow() {
  if (!confirm('어제까지의 1분 기록을 10분 요약으로 줄입니다. (kWh·가동시간은 1분 기준으로 먼저 계산해 보관 · 되돌릴 수 없음) 진행할까요?')) return;
  const st = document.getElementById('cv-st'); let days = 0, del = 0;
  for (let g = 0; g < 200; g++) {
    const { data, error } = await sb.rpc('load_compact', { p_keep: 0, p_max: 3 }); if (error) { st.textContent = '실패: ' + error.message + ' (30·31번 SQL 실행 확인)'; return; }
    days += data.days; del += Number(data.deleted); st.textContent = `정리 중... ${days}일 · ${del.toLocaleString()}줄 줄임 (남은 날 ${data.left_days}일)`;
    if (!data.days || !data.left_days) break;
  }
  st.textContent = days ? `완료: ${days}일 치 1분 기록 ${del.toLocaleString()}줄을 10분 요약으로 줄였습니다.` : '정리할 지난 1분 기록이 없습니다.';
}

// ---------------- 가동시간 (가동 기준 전류 이상인 시간) ----------------
async function renderRun() {
  const el = document.getElementById('body');
  const on = []; PANELS.forEach(p => [0, 1, 2].forEach(c => { const x = (CH[p.id] || [])[c]; if (x && x.on_a !== null && x.on_a !== undefined) on.push({ p, c, on_a: Number(x.on_a) }); }));
  if (!on.length) { el.innerHTML = `<div class="empty">가동 기준 전류가 들어간 채널이 없습니다.<br>「설정」 탭에서 보일러·컴프레셔 등의 <b>가동 기준 (A)</b>를 넣어 주세요.</div>`; return; }
  el.innerHTML = rangeBar('rn') + '<div class="loading">계산 중...</div>';
  let rows = [];
  try { for (let o = 0; o < 20; o++) { const { data, error } = await sb.rpc('load_run_get', { p_from: rnFrom, p_to: rnTo }).range(o * 1000, o * 1000 + 999); if (error) throw error; rows = rows.concat(data || []); if (!data || data.length < 1000) break; } }
  catch (e) { el.querySelector('.loading').innerHTML = '불러오기 실패: ' + esc(e.message || e) + '<br>Supabase에 30번·31번 SQL을 실행했는지 확인해 주세요.'; return; }
  if (rnTo >= today()) { try { await sb.rpc('load_day_get', { p_from: today(), p_to: today() }); } catch (e) { } }   // 오늘 누락 구간 갱신
  const GG = await loadGaps(rnFrom, rnTo);
  const R = {}; rows.forEach(r => { R[r.d + '|' + r.panel_id + '|' + r.ch] = r; });
  const days = []; for (let d = rnFrom; d <= rnTo; d = addDays(d, 1)) days.push(d);
  const tm = t => t ? hm(new Date(t)) : '-', hr = m => (Number(m) / 60).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
  const sum = on.map(o => { const v = days.map(d => R[d + '|' + o.p.id + '|' + o.c]).filter(Boolean); const m = v.reduce((a, r) => a + Number(r.run_min || 0), 0), dd = v.filter(r => Number(r.run_min) > 0).length;
    return { m, dd, st: v.reduce((a, r) => a + Number(r.starts || 0), 0) }; });
  el.querySelector('.loading').outerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:10px">${on.map((o, j) => `<div class="card"><div class="hint">${esc(o.p.name)} · 기준 ${f1(o.on_a)} A 이상</div><div style="font-size:15px;font-weight:700;margin:2px 0">${esc(nameRange(o.p.id, o.c, rnFrom, rnTo))}</div>
      <div style="font-size:22px;font-weight:700">${hr(sum[j].m)} <small style="font-size:12px;color:#888">시간</small></div><div class="hint">돈 날 ${sum[j].dd}일 · 하루 평균 ${sum[j].dd ? hr(sum[j].m / sum[j].dd) : 0}시간 · 켠 횟수 ${sum[j].st}회</div></div>`).join('')}</div>
    <div class="card"><div class="tbl-wrap"><table class="t"><tr><th class="l" rowspan="2">날짜</th>${on.map(o => `<th colspan="3" style="text-align:center">${esc(o.p.name)} · ${esc(chName(o.p.id, o.c))}</th>`).join('')}</tr>
      <tr>${on.map(() => '<th>처음 켠 시각</th><th>마지막 끈 시각</th><th>가동 (켠 횟수)</th>').join('')}</tr>` +
      days.map(d => `<tr><td class="l">${d.slice(5).replace('-', '/')} <span class="hint">${'일월화수목금토'[new Date(d + 'T00:00:00').getDay()]}</span></td>${on.map(o => { const r = R[d + '|' + o.p.id + '|' + o.c], a = asgAt(o.p.id, o.c, d), bg = a ? ' style="background:var(--amber-bg)"' : '';
        return !r || !Number(r.run_min) ? `<td${bg}>-</td><td${bg}>-</td><td${bg} style="color:#aaa">${r ? '안 돎' : '기록 없음'}</td>` : `<td${bg}>${tm(r.first_on)}</td><td${bg}>${tm(r.last_off)}</td><td${bg}><b>${hr(r.run_min)}h</b> <span class="hint">(${r.starts}회)</span>${gapMark(GG.G, d, o.p.id)}</td>`; }).join('')}</tr>`).join('') + `</table></div>
    <div class="hint" style="margin-top:6px">· 가동 = 전류가 「설정」의 가동 기준 이상인 시간의 합 · 켠 횟수 = 기준 아래 → 위로 올라간 횟수 (자주 켜졌다 꺼지면 많아짐)<br>· 처음 켠 시각·마지막 끈 시각은 그날 0시~24시 기준 · 밤새 돌면 00:00 / 24:00 근처로 나옵니다.${ASSIGN.length ? '<br>· 주황 칸 = 측정 이력상 그 날은 다른 설비를 잰 값' : ''}<br>· <span style="color:var(--red)">⚠</span> = 그 날 기록이 빈 시간 (마우스를 올리면 구간) — 그 시간은 가동시간에 안 들어감</div></div>` + gapCard(GG, rnFrom, rnTo);
}

function backupBanner() {
  if (!isAdmin()) return '';
  const d = today(); if (Number(d.slice(8)) > 10) return '';
  const x = new Date(d.slice(0, 8) + '01T00:00:00'); x.setMonth(x.getMonth() - 1); const m = x.toLocaleDateString('sv-SE').slice(0, 7);
  try { if (localStorage.getItem('load-bk-' + m)) return ''; } catch (e) { return ''; }
  return `<div class="card" id="bk-ban" style="margin-top:10px;border-color:var(--blue);background:var(--blue-bg);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span>📦 <b>${m.slice(5)}월 1분 기록 백업</b>을 회사 PC에 받아 두세요 (CSV · 엑셀로 열림)</span><span class="hint" id="bk-st"></span>
    <button class="chip on" style="margin-left:auto" onclick="csvMonth('${m}')">⬇ 받기</button><button class="chip" onclick="try{localStorage.setItem('load-bk-${m}','1')}catch(e){};this.parentNode.remove()">이번 달은 안 받기</button></div>`;
}
function show(v) {
  view = v; clearTimeout(timer);
  document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  const ban = document.getElementById('bk-ban'); if (ban) ban.remove();
  if (v === 'now') renderNow(); else if (v === 'trend') renderTrend(); else if (v === 'kwh') renderKwh(); else if (v === 'run') renderRun(); else { SET = null; renderSet(); }
}
document.querySelectorAll('.vtab').forEach(b => b.addEventListener('click', () => show(b.dataset.v)));

Portal.start({
  appId: 'load',
  title: '설비별 부하 모니터링',
  onReady: async P => {
    sb = P.sb; document.getElementById('app').hidden = false;
    const d = today(); trFrom = trTo = d; kwFrom = d.slice(0, 8) + '01'; kwTo = d; rnFrom = addDays(d, -6); rnTo = d;
    try { await loadConfig(); show('now'); }
    catch (e) { document.getElementById('body').innerHTML = `<div class="empty">불러오기 실패: ${esc(e.message || e)}<br>Supabase에 25번 SQL(25_load_monitor.sql)을 실행했는지 확인해 주세요.</div>`; }
  }
});
