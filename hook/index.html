<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>후크메타 부하 측정</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../common.js"></script>
  <style>
    :root { --primary: #1a1a1a; --bg: #f5f5f5; --card: #fff; --border: #e0e0e0; --text: #1a1a1a; --muted: #888;
      --teal: #1D9E75; --teal-bg: #E1F5EE; --amber: #BA7517; --amber-bg: #FAEEDA; --red: #A32D2D; --red-bg: #FCEBEB; --blue: #185FA5; --blue-bg: #E6F1FB; --radius: 12px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    [hidden] { display: none !important; }
    .wrap { max-width: 640px; margin: 0 auto; } .wrap.wide { max-width: 1200px; }
    .head { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 14px; position: sticky; top: 0; z-index: 10; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title { font-size: 17px; font-weight: 700; }
    .vtabs { display: flex; gap: 6px; }
    .vtab { font-size: 12px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--muted); cursor: pointer; }
    .vtab.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .date-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .date-row button { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); cursor: pointer; }
    .date-row input { flex: 1; font-size: 15px; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; text-align: center; background: var(--card); }
    .date-row .today { width: auto; padding: 0 10px; font-size: 12px; }
    .panels { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
    .panels button { flex: none; font-size: 13px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 18px; background: var(--card); cursor: pointer; white-space: nowrap; }
    .panels button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .panels button .n { font-size: 11px; opacity: .8; margin-left: 4px; }
    .content { padding: 12px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 120px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
    .card.run { border-color: var(--teal); }
    .card.off { opacity: .75; }
    .c-top { display: flex; gap: 6px; align-items: center; }
    .c-top .nm { flex: 1; font-size: 15px; font-weight: 700; border: none; border-bottom: 1px dashed transparent; padding: 2px 0; background: transparent; min-width: 0; }
    .c-top .nm:focus { border-bottom-color: var(--border); outline: none; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }
    .seg button { border: none; background: #fff; padding: 5px 8px; font-size: 12px; cursor: pointer; color: var(--muted); }
    .seg button.on { background: var(--primary); color: #fff; }
    .run-btn { flex: none; font-size: 12px; padding: 6px 10px; border-radius: 16px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--muted); }
    .run-btn.on { background: var(--teal-bg); color: var(--teal); border-color: var(--teal); font-weight: 700; }
    .amps { display: grid; grid-template-columns: repeat(3, 1fr) 1.1fr; gap: 6px; margin-top: 8px; align-items: end; }
    .amps label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
    .amps input { font-size: 17px; padding: 8px 6px; border: 1px solid var(--border); border-radius: 8px; text-align: right; width: 100%; }
    .amps .kw { text-align: right; font-size: 12px; color: var(--muted); }
    .amps .kw b { display: block; font-size: 17px; color: var(--text); }
    .meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .meta input { font-size: 12px; border: none; border-bottom: 1px solid var(--border); padding: 4px 2px; background: transparent; }
    .meta .rk { width: 52px; text-align: right; } .meta .ra { width: 46px; text-align: right; } .meta .ml { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 3px; } .meta .nt { flex: 1; min-width: 140px; }
    .last { font-size: 11px; color: var(--blue); margin-top: 4px; }
    .dirty { box-shadow: 0 0 0 2px var(--amber-bg); border-color: var(--amber); }
    .addbtn { padding: 12px; border: 1px dashed #bbb; border-radius: var(--radius); background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; }
    .footer { background: var(--card); border-top: 1px solid var(--border); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; }
    .footer-in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
    .footer .sum { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.4; } .footer .sum b { color: var(--text); font-size: 14px; }
    .save { padding: 13px 22px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; }
    .save.has { background: var(--blue); }
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50; }
    .toast.show { opacity: 1; }
    .loading { text-align: center; padding: 40px 0; color: var(--muted); }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
    /* 결과 */
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 12px; }
    table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.t th, table.t td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: right; white-space: nowrap; }
    table.t th { background: #f0f2f5; font-weight: 600; text-align: center; position: sticky; top: 0; }
    table.t td.l, table.t th.l { text-align: left; }
    table.t tr.grp td { background: #f7f9fb; font-weight: 700; text-align: left; color: var(--blue); }
    table.t tr.off td { color: #aaa; }
    .tbl { overflow: auto; max-height: calc(100vh - 220px); }
    .bar { display: inline-block; height: 8px; background: var(--blue); border-radius: 4px; vertical-align: middle; }
    .lr-hi { color: var(--red); font-weight: 700; } .lr-lo { color: var(--amber); }
    .tool { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .tool select, .tool input { font-size: 13px; padding: 6px; border: 1px solid var(--border); border-radius: 6px; }
    .btn { background: #2c5aa0; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn.sec { background: #666; } .mini { font-size: 11px; padding: 3px 7px; border: 1px solid var(--border); border-radius: 6px; background: #fff; cursor: pointer; }
    .hist { font-size: 12px; color: var(--muted); }
    .card.feed { border-left: 4px solid #7a4fbf; }
    .feedtag { font-size: 11px; color: #5b3a96; background: #f2ecfb; border-radius: 6px; padding: 4px 6px; margin-top: 6px; }
    .feedtag-s { font-size: 11px; color: #5b3a96; }
    .feedinfo { background: #f2ecfb; border-color: #d8c8f0; font-size: 13px; }
    tr.feedrow td { background: #faf7fe; }
    .meta .fd { width: 150px; }
    .panels .sub { opacity: .7; }
    /* 사진 */
    .ph-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .ph-strip img { height: 64px; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; flex: none; }
    .ph-strip img.pn { border: 2px solid var(--blue); }
    .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 6px 0 16px; }
    .ph-it { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fafafa; display: flex; flex-direction: column; }
    .ph-it img { width: 100%; height: 130px; object-fit: cover; cursor: zoom-in; background: #eee; }
    .ph-it.pn { border-color: var(--blue); }
    .ph-it .pc { padding: 5px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
    .ph-it select, .ph-it input { font-size: 11px; padding: 3px; border: 1px solid var(--border); border-radius: 4px; width: 100%; }
    .ph-it .row { display: flex; gap: 4px; align-items: center; } .ph-it .mini { white-space: nowrap; flex: none; }
    .ph-h { font-weight: 700; color: var(--blue); margin: 10px 0 2px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 16px; background: #fff; cursor: pointer; }
    .chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .upbox { border: 2px dashed #bbb; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .upbox.over { border-color: var(--blue); background: var(--blue-bg); }
    textarea.imp { width: 100%; min-height: 140px; font-family: Consolas, monospace; font-size: 12px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
    #lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 100; display: flex; align-items: center; justify-content: center; }
    #lb img { max-width: 94vw; max-height: 86vh; object-fit: contain; }
    #lb button { position: absolute; background: rgba(255,255,255,.15); color: #fff; border: none; font-size: 22px; width: 48px; height: 48px; border-radius: 24px; cursor: pointer; }
    #lb .lb-x { top: 12px; right: 12px; } #lb .lb-p { left: 8px; top: 50%; } #lb .lb-n { right: 8px; top: 50%; }
    #lb-cap { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app" hidden>
    <div class="head">
      <div class="wrap" id="head-wrap">
        <div class="head-row">
          <span class="title">⚡ 후크메타 부하 측정</span>
          <div class="vtabs">
            <button class="vtab on" data-v="input" onclick="setView('input')">측정</button>
            <button class="vtab" data-v="sum" onclick="setView('sum')">결과·이력</button>
            <button class="vtab" data-v="photo" onclick="setView('photo')">사진·작성표</button>
          </div>
        </div>
        <div id="input-head">
          <div class="date-row">
            <button onclick="shiftDate(-1)">◀</button>
            <input type="date" id="work-date" onchange="changeDate(this.value)">
            <button onclick="shiftDate(1)">▶</button>
            <button class="today" onclick="changeDate(todayStr())">오늘</button>
          </div>
          <div class="panels" id="panels"></div>
        </div>
      </div>
    </div>

    <div id="v-input">
      <div class="wrap"><div class="content" id="content"><div class="loading">불러오는 중...</div></div></div>
      <div class="footer"><div class="footer-in"><div class="sum" id="sum"></div><button class="save" id="save-btn" onclick="saveAll()">저장</button></div></div>
    </div>

    <div id="v-sum" hidden>
      <div class="wrap wide"><div class="panel" id="sum-body"></div></div>
    </div>
    <div id="v-photo" hidden>
      <div class="wrap wide"><div class="panel" id="photo-body"></div></div>
    </div>
    <div id="lb" hidden onclick="if(event.target.id==='lb')lbClose()"><button class="lb-x" onclick="lbClose()">✕</button><button class="lb-p" onclick="lbGo(-1)">◀</button><img id="lb-img" alt=""><button class="lb-n" onclick="lbGo(1)">▶</button><div id="lb-cap"></div></div>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    let sb = null, me = null;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad2 = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const todayStr = () => ymd(new Date());
    const addDays = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
    const errMsg = e => (e && (e.message || e.error_description || e.error)) || String(e);
    const num = v => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);
    const nf = (v, d = 1) => v === null || v === undefined || isNaN(v) ? '-' : Number(v).toLocaleString('ko-KR', { maximumFractionDigits: d });
    const isAdmin = () => me && me.role === 'admin';
    const PF = 0.85; // 역률 가정 (모터 일반값)
    // 전력 kW: 상전압 220V × 상별 전류 합 × 역률 (380V 3상이면 √3×380×평균전류×역률과 같음)
    function kwOf(b, x) {
      const a = [x.r, x.s, x.t].map(num).filter(v => v !== null);
      if (!a.length) return null;
      if (b.volt === 380) { const avg = a.reduce((p, c) => p + c, 0) / a.length; return Math.sqrt(3) * 0.38 * avg * PF; }
      return 0.22 * a.reduce((p, c) => p + c, 0) * PF;
    }
    function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 1800); }

    let BRK = [], READ = [], workDate = todayStr(), panelSel = null, DRAFT = {}, BDRAFT = {}, NEWB = [], view = 'input';
    async function fetchAll(q) { const out = []; for (let from = 0; ; from += 1000) { const { data, error } = await q().range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out; }
    async function loadAll() {
      BRK = await fetchAll(() => sb.from('hook_breakers').select('*').eq('active', true).order('panel').order('sort').order('created_at'));
      READ = await fetchAll(() => sb.from('hook_readings').select('*').order('d'));
    }
    const allB = () => BRK.map(b => bv(b)).concat(NEWB);
    const feedOf = b => String((b && b.feeds) || '').trim(); // 하위 분전반 메인(피더)이면 그 분전반 이름
    const parentOf = p => { const f = allB().find(b => feedOf(b) === p && b.panel !== p); return f || null; };
    function panels() { // 위 분전반 → 하위 분전반 순서 (트리)
      const set = [...new Set(BRK.map(b => b.panel).concat(NEWB.map(b => b.panel)).concat(PHOTOS.map(p => p.panel).filter(Boolean)).concat(allB().map(feedOf).filter(Boolean)))];
      const kids = p => allB().filter(b => b.panel === p && feedOf(b) && feedOf(b) !== p).sort((a, c) => (a.sort || 0) - (c.sort || 0)).map(feedOf);
      const out = [], seen = new Set(), walk = (p, d) => { if (seen.has(p)) return; seen.add(p); out.push(p); PDEPTH[p] = d; kids(p).forEach(k => walk(k, d + 1)); };
      set.filter(p => !parentOf(p)).forEach(p => walk(p, 0)); set.forEach(p => walk(p, 0)); // 순환 연결이 있어도 빠지지 않게
      return out;
    }
    const PDEPTH = {};
    const readOn = (bid, d) => READ.find(r => r.breaker_id === bid && r.d === d);
    const lastBefore = (bid, d) => READ.filter(r => r.breaker_id === bid && r.d < d).sort((a, b) => a.d < b.d ? 1 : -1)[0];

    function setView(v) {
      if (v === 'sum' && dirtyCount() && !confirm('저장하지 않은 측정값이 있습니다. 저장하지 않고 이동할까요?')) return;
      view = v; document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
      document.getElementById('v-input').hidden = v !== 'input'; document.getElementById('v-sum').hidden = v !== 'sum'; document.getElementById('v-photo').hidden = v !== 'photo';
      document.getElementById('input-head').hidden = v !== 'input'; document.getElementById('head-wrap').classList.toggle('wide', v !== 'input');
      if (v === 'sum') renderSum(); else if (v === 'photo') renderPhoto(); else renderInput();
    }
    function changeDate(d) { if (dirtyCount() && !confirm('저장하지 않은 측정값이 있습니다. 버리고 날짜를 바꿀까요?')) { document.getElementById('work-date').value = workDate; return; } workDate = d; DRAFT = {}; renderInput(); }
    function shiftDate(n) { changeDate(addDays(workDate, n)); }
    const dirtyCount = () => Object.keys(DRAFT).length + Object.keys(BDRAFT).length + NEWB.filter(b => b.name.trim()).length;

    function renderInput() {
      document.getElementById('work-date').value = workDate;
      const ps = panels(); if (!panelSel || !ps.includes(panelSel)) panelSel = ps[0] || null;
      const cnt = p => { const bs = BRK.filter(b => b.panel === p); return `${bs.filter(b => readOn(b.id, workDate) || DRAFT[b.id]).length}/${bs.length}`; };
      document.getElementById('panels').innerHTML = ps.map(p => `<button class="${p === panelSel ? 'on' : ''}" onclick="panelSel=${JSON.stringify(p).replace(/"/g, '&quot;')};renderInput()">${PDEPTH[p] ? '<span class="sub">' + '↳'.repeat(PDEPTH[p]) + '</span> ' : ''}${esc(p)}<span class="n">${cnt(p)}</span></button>`).join('') +
        `<button onclick="addPanel()">＋ 분전반</button>`;
      const el = document.getElementById('content');
      if (!panelSel) { el.innerHTML = `<div class="card"><b>분전반을 먼저 만들어 주세요.</b><div class="hint">위의 「＋ 분전반」을 누르고 분전반 이름(예: P-레토르트, 기계실 MCC)을 넣은 뒤, 차단기를 추가합니다.</div></div>`; renderSumBar(); return; }
      const bs = BRK.filter(b => b.panel === panelSel).concat(NEWB.filter(b => b.panel === panelSel));
      const par = parentOf(panelSel);
      el.innerHTML = `<datalist id="pl">${ps.filter(p => p !== panelSel).map(p => `<option value="${esc(p)}">`).join('')}</datalist>` +
        (par ? `<div class="card feedinfo">↳ <b>${esc(panelSel)}</b>은(는) <a href="#" onclick="panelSel=${JSON.stringify(par.panel).replace(/"/g, '&quot;')};renderInput();return false">${esc(par.panel)}</a> 의 「${esc(par.name || '차단기')}」에서 분기된 하위 분전반입니다.</div>` : '') +
        photoStrip(panelSel) + `<div class="hint">가동 중인 차단기만 R·S·T 전류(A)를 재서 넣으세요. 안 돌고 있으면 「정지」로 두면 됩니다. kW는 역률 ${PF} 가정으로 계산합니다.</div>` +
        bs.map(cardHtml).join('') + `<button class="addbtn" onclick="addBreaker()">＋ 차단기 추가 (${esc(panelSel)})</button>`;
      renderSumBar();
    }
    // 분전반 아래(하위 포함) 말단 부하 합 — today=true면 측정 화면 날짜 값, 아니면 차단기별 최근 가동 측정값
    function subtreeKw(p, today, seen = new Set()) {
      if (seen.has(p)) return { kw: 0, n: 0 }; seen.add(p); let kw = 0, n = 0;
      allB().filter(b => b.panel === p).forEach(b => {
        if (feedOf(b) && feedOf(b) !== p) { const s = subtreeKw(feedOf(b), today, seen); kw += s.kw; n += s.n; return; }
        let k = null; if (today) { const c = cur(b); if (c.running !== false) k = kwOf(b, c); } else { const l = READ.filter(r => r.breaker_id === b.id && r.running).sort((a, c) => a.d < c.d ? 1 : -1)[0]; if (l) k = kwOf(b, l); }
        if (k !== null) { kw += k; n++; } });
      return { kw, n };
    }
    function cur(b) { // 화면에 보일 값 = 고친 값 > 그날 기록
      const r = readOn(b.id, workDate) || {}, d = DRAFT[b.id] || {};
      const g = k => (k in d) ? d[k] : (r[k] ?? '');
      const running = ('running' in d) ? d.running : (r.id ? r.running : null);
      return { r: g('r'), s: g('s'), t: g('t'), note: g('note'), running, saved: !!r.id };
    }
    function bv(b) { return Object.assign({}, b, BDRAFT[b.id] || {}); }
    function cardHtml(b0) {
      const b = bv(b0), c = cur(b), kw = kwOf(b, c), last = b.id && !b._new ? lastBefore(b.id, workDate) : null;
      const run = c.running === true || (c.running === null && kw !== null), off = c.running === false;
      const dirty = DRAFT[b.id] || BDRAFT[b.id] || b._new;
      const lr = kw !== null && num(b.rated_kw) ? kw / num(b.rated_kw) * 100 : null;
      const id = esc(b.id);
      return `<div class="card ${run ? 'run' : ''} ${off ? 'off' : ''} ${dirty ? 'dirty' : ''} ${feedOf(b) ? 'feed' : ''}" data-id="${id}">
        <div class="c-top"><input class="nm" value="${esc(b.name)}" placeholder="차단기 명칭 (예: 레토르트 1호기)" onchange="bset('${id}','name',this.value)">
          <span class="seg"><button class="${b.volt === 380 ? 'on' : ''}" onclick="bset('${id}','volt',380)">380V</button><button class="${b.volt === 220 ? 'on' : ''}" onclick="bset('${id}','volt',220)">220V</button></span>

      return await new Promise((ok, no) => cv.toBlob(b => b ? ok(b) : no(new Error('사진 변환 실패')), 'image/jpeg', 0.82));
    }
    const uuid = () => crypto.randomUUID ? crypto.randomUUID() : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    async function phUpload(files) {
      files = [...files].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|heic|webp)$/i.test(f.name)); if (!files.length) return;
      const sel = document.getElementById('ph-panel'); let panel = sel ? sel.value : phPanel;
      phPanel = panel; const st = document.getElementById('ph-st'); let ok = 0, fail = [];
      const base = PHOTOS.filter(x => x.panel === panel).length;
      for (let i = 0; i < files.length; i++) {
        st.textContent = `올리는 중... ${i + 1}/${files.length}`;
        try {
          const blob = await compressImage(files[i]), id = uuid(), d = new Date(), path = `hook/${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${id}.jpg`;
          const up = await sb.storage.from('pm-photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false }); if (up.error) throw up.error;
          const row = { id, panel, kind: phKind, path, note: files[i].name.replace(/\.[^.]+$/, ''), sort: base + i };
          const { error } = await sb.from('hook_photos').insert(row); if (error) throw error;
          PHOTOS.push(Object.assign({ created_at: new Date().toISOString() }, row)); ok++;
        } catch (e) { fail.push(`${files[i].name}: ${errMsg(e)}`); }
      }
      await signUrls(PHOTOS.map(p => p.path));
      phFilter = panel; renderPhoto();
      toast(`사진 ${ok}장 올림${fail.length ? ` · 실패 ${fail.length}` : ''}`);
      if (fail.length) alert('올리지 못한 사진:\n' + fail.join('\n') + (/relation|does not exist|schema cache/i.test(fail.join(' ')) ? '\n\nSupabase에 19번 SQL을 실행했는지 확인해 주세요.' : ''));
    }
    function phPickPanel(v) { if (v === '__new') { const n = (prompt('분전반 이름 (예: P-레토르트, 기계실 MCC)') || '').trim(); if (n) { phPanel = n; if (!NEWB.some(b => b.panel === n) && !BRK.some(b => b.panel === n)) PH_EXTRA.add(n); } } else phPanel = v; renderPhoto(); }
    const PH_EXTRA = new Set(); // 사진 올리기 전 새로 적은 분전반 이름
    async function phSet(id, k, v) {
      if (k === 'panel' && v === '__new') { v = (prompt('분전반 이름') || '').trim(); if (!v) { renderPhoto(); return; } }
      const { error } = await sb.from('hook_photos').update({ [k]: v }).eq('id', id); if (error) { alert('저장 실패: ' + errMsg(error)); return; }
      Object.assign(PHOTOS.find(x => x.id === id), { [k]: v }); if (k !== 'note') renderPhoto(); else toast('메모 저장');
    }
    async function phDel(id) {
      const x = PHOTOS.find(p => p.id === id); if (!x || !confirm('이 사진을 지울까요?')) return;
      const { error } = await sb.from('hook_photos').delete().eq('id', id); if (error) { alert('삭제 실패: ' + errMsg(error)); return; }
      try { await sb.storage.from('pm-photos').remove([x.path]); } catch (e) { }
      PHOTOS = PHOTOS.filter(p => p.id !== id); renderPhoto();
    }
    function renderPhoto() {
      const el = document.getElementById('photo-body'), ps = [...new Set(panels().concat([...PH_EXTRA]))], q = s => JSON.stringify(s).replace(/"/g, '&quot;');
      const groups = [...new Set(PHOTOS.map(x => x.panel || ''))].sort((a, b) => a === '' ? 1 : b === '' ? -1 : ps.indexOf(a) - ps.indexOf(b));
      if (phFilter !== null && !groups.includes(phFilter)) phFilter = null;
      const panelOpts = cur => `<option value="" ${!cur ? 'selected' : ''}>미분류</option>${ps.map(p => `<option ${p === cur ? 'selected' : ''}>${esc(p)}</option>`).join('')}<option value="__new">＋ 새 분전반…</option>`;
      let h = photoErr ? `<div class="card" style="border-color:var(--red)"><b>사진 목록을 불러오지 못했습니다.</b><div class="hint">${esc(photoErr)}<br>Supabase에 <b>19번 SQL (19_hook_photos.sql)</b>을 실행해 주세요.</div></div>` : '';
      h += `<div class="tool"><b>1. 사진 올리기</b></div>
        <label class="upbox" id="ph-drop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');phUpload(event.dataTransfer.files)">
          <div class="tool" style="margin:0">분전반 <select id="ph-panel" onchange="phPickPanel(this.value)">${panelOpts(phPanel)}</select>
            <span class="chips"><button type="button" class="chip ${phKind === 'panel' ? 'on' : ''}" onclick="phKind='panel';renderPhoto()">분전반 전체 사진</button><button type="button" class="chip ${phKind === 'breaker' ? 'on' : ''}" onclick="phKind='breaker';renderPhoto()">차단기 근접 사진</button></span></div>
          <div><input type="file" id="ph-file" accept="image/*" multiple hidden onchange="phUpload(this.files);this.value=''"><button type="button" class="btn" onclick="document.getElementById('ph-file').click()">📷 사진 고르기 (여러 장)</button>
            <span class="hint">또는 여기로 끌어다 놓기 · 한 번에 한 분전반씩 올리면 분류가 편합니다. 미분류로 올리고 나중에 분전반을 골라도 됩니다.</span></div>
          <span class="hint" id="ph-st"></span></label>`;
      h += `<div class="tool" style="margin-top:14px"><b>2. 사진 보기·분류</b> <span class="hint">${PHOTOS.length}장</span></div>
        <div class="chips" style="margin-bottom:6px"><button class="chip ${phFilter === null ? 'on' : ''}" onclick="phFilter=null;renderPhoto()">전체</button>${groups.map(g => `<button class="chip ${phFilter === g ? 'on' : ''}" onclick="phFilter=${q(g)};renderPhoto()">${g ? esc(g) : '미분류'} ${phOf(g).length}</button>`).join('')}</div>`;
      (phFilter === null ? groups : [phFilter]).forEach(g => {
        const L = phOf(g);
        h += `<div class="ph-h">${g ? esc(g) : '미분류'} <span class="hint">${L.length}장</span></div><div class="ph-grid">${L.map((x, i) => `<div class="ph-it ${x.kind === 'panel' ? 'pn' : ''}"><img loading="lazy" src="${esc(URLS[x.path] || '')}" onclick="lbOpen(${q(g)},${i})">
          <div class="pc"><select onchange="phSet('${x.id}','panel',this.value)">${panelOpts(x.panel)}</select>
            <div class="row"><select onchange="phSet('${x.id}','kind',this.value)"><option value="panel" ${x.kind === 'panel' ? 'selected' : ''}>분전반 전체</option><option value="breaker" ${x.kind === 'breaker' ? 'selected' : ''}>차단기</option></select>${isAdmin() ? `<button class="mini" onclick="phDel('${x.id}')">삭제</button>` : ''}</div>
            <input placeholder="메모 (예: 1~3번 차단기)" value="${esc(x.note || '')}" onchange="phSet('${x.id}','note',this.value)"></div></div>`).join('')}</div>`;
      });
      if (!PHOTOS.length && !photoErr) h += '<div class="hint">아직 올린 사진이 없습니다.</div>';
      h += `<div class="tool" style="margin-top:18px"><b>3. 작성표 붙여넣기 → 차단기 한꺼번에 등록</b></div>
        <div class="hint">Claude 채팅에 사진을 보내 분류를 받으면, 받은 작성표를 그대로 붙여넣으세요. 엑셀에서 복사한 표도 됩니다.<br>칸 순서: <b>분전반 · 차단기 명칭 · 전압(380/220) · 정격 kW · 차단기 A · 비고 · 하위 분전반</b> (탭, |, 쉼표로 구분 · 제목 줄은 자동으로 건너뜀)<br>하위 분전반 칸: 그 차단기가 다른 분전반의 메인이면 그 분전반 이름 (합계에서 이중으로 안 더함), 아니면 비움</div>
        <textarea class="imp" id="imp-text" placeholder="P-레토르트\t레토르트 1호기 순환펌프\t380\t7.5\t30\t사진 3번&#10;P-레토르트\t조명\t220\t\t20\t"></textarea>
        <div class="tool" style="margin-top:6px"><button class="btn" onclick="impPreview()">미리보기</button><span class="hint" id="imp-st"></span></div><div id="imp-prev"></div>`;
      el.innerHTML = h;
    }
    function impParse(text) {
      const out = [];
      String(text || '').split(/\r?\n/).forEach(line => {
        let t = line.trim(); if (!t || /^[|\-\s:]+$/.test(t)) return;
        let c = t.includes('\t') ? t.split('\t') : t.includes('|') ? t.replace(/^\||\|$/g, '').split('|') : t.split(',');
        c = c.map(x => x.trim());
        if (/분전반/.test(c[0]) && /차단기|명칭/.test(c[1] || '')) return; // 제목 줄
        if (!c[0] || !c[1]) return;
        const v = String(c[2] || '').replace(/[^0-9]/g, ''), n = x => { const s = String(x || '').replace(/[^0-9.]/g, ''); return s === '' ? '' : s; };
        out.push({ panel: c[0], name: c[1], volt: v === '220' ? 220 : 380, voltRaw: c[2] || '', rated_kw: n(c[3]), rated_a: n(c[4]), note: c[5] || '', feeds: (c[6] || '').replace(/^[-–]$/, '').trim() });
      });
      return out;
    }
    let IMP = [];
    function impPreview() {
      IMP = impParse(document.getElementById('imp-text').value);
      const dup = r => BRK.some(b => b.panel === r.panel && b.name === r.name) || NEWB.some(b => b.panel === r.panel && b.name === r.name);
      IMP.forEach(r => { r.dup = dup(r); });
      const n = IMP.filter(r => !r.dup).length;
      document.getElementById('imp-st').textContent = IMP.length ? `${IMP.length}줄 읽음 · 새로 추가 ${n}개${IMP.length - n ? ` · 이미 있는 차단기 ${IMP.length - n}개는 건너뜀` : ''}` : '읽은 줄이 없습니다. 칸 순서를 확인해 주세요.';
      document.getElementById('imp-prev').innerHTML = IMP.length ? `<div class="tbl" style="max-height:360px"><table class="t"><tr><th class="l">분전반</th><th class="l">차단기</th><th>전압</th><th>정격 kW</th><th>차단기 A</th><th class="l">비고</th><th class="l">하위 분전반</th><th></th></tr>${IMP.map(r => `<tr class="${r.dup ? 'off' : ''}"><td class="l">${esc(r.panel)}</td><td class="l">${esc(r.name)}</td><td>${r.volt}V${r.voltRaw && !/220|380/.test(r.voltRaw) ? ' <span class="lr-lo">?</span>' : ''}</td><td>${esc(r.rated_kw)}</td><td>${esc(r.rated_a)}</td><td class="l hist">${esc(r.note)}</td><td class="l">${r.feeds ? '⤷ ' + esc(r.feeds) : ''}</td><td>${r.dup ? '이미 있음' : '추가'}</td></tr>`).join('')}</table></div>
        ${n ? `<div class="tool" style="margin-top:8px"><button class="btn" onclick="impApply()">✓ ${n}개를 측정 화면에 추가 (저장 전 확인)</button><span class="hint">추가 후 측정 화면에서 확인·수정하고 [저장]을 눌러야 등록됩니다.</span></div>` : ''}` : '';
    }
    function impApply() {
      const add = IMP.filter(r => !r.dup); if (!add.length) return;
      add.forEach(r => { NEWB.push({ id: 'new-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), _new: true, panel: r.panel, name: r.name, volt: r.volt, rated_kw: r.rated_kw, rated_a: r.rated_a, note: r.note, feeds: r.feeds || '',
        sort: BRK.filter(b => b.panel === r.panel).length + NEWB.filter(b => b.panel === r.panel).length }); });
      panelSel = add[0].panel; IMP = []; setView('input'); toast(`차단기 ${add.length}개 추가 — 확인 후 [저장]`);
    }
    function lbOpen(p, i) { LB = { list: phOf(p), i }; lbShow(); document.getElementById('lb').hidden = false; }
    function lbShow() { const x = LB.list[LB.i]; if (!x) return; document.getElementById('lb-img').src = URLS[x.path] || ''; document.getElementById('lb-cap').textContent = `${x.panel || '미분류'} · ${x.kind === 'panel' ? '분전반 전체' : '차단기'}${x.note ? ' · ' + x.note : ''} (${LB.i + 1}/${LB.list.length})`; }
    function lbGo(n) { LB.i = (LB.i + n + LB.list.length) % LB.list.length; lbShow(); }
    function lbClose() { document.getElementById('lb').hidden = true; }
    document.addEventListener('keydown', e => { if (document.getElementById('lb').hidden) return; if (e.key === 'Escape') lbClose(); if (e.key === 'ArrowLeft') lbGo(-1); if (e.key === 'ArrowRight') lbGo(1); });

    window.addEventListener('beforeunload', e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ''; } });

    Portal.start({
      appId: 'hook',
      title: '후크메타 부하 측정',
      onReady: async P => {
        sb = P.sb; me = P.me;
        try { await loadAll(); await loadPhotos(); renderInput(); }
        catch (e) { document.getElementById('content').innerHTML = `<div class="loading">불러오기 실패: ${esc(errMsg(e))}<br>Supabase에 17번 SQL(17_hook_load.sql)을 실행했는지 확인해 주세요.</div>`; }
      }
    });
  </script>
