<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>설비검침</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="../config.js"></script>
  <script src="../common.js"></script>
  <style>
    :root {
      --primary: #1a1a1a; --bg: #f5f5f5; --card: #fff; --border: #e0e0e0;
      --text: #1a1a1a; --muted: #888; --hint: #bbb;
      --teal: #1D9E75; --teal-bg: #E1F5EE; --amber: #BA7517; --amber-bg: #FAEEDA;
      --red: #A32D2D; --red-bg: #FCEBEB; --blue: #185FA5; --blue-bg: #E6F1FB;
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    [hidden] { display: none !important; }
    .wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .head { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 14px; }
    .head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
    .title { font-size: 17px; font-weight: 700; white-space: nowrap; }
    .btn-admin { font-size: 12px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--muted); cursor: pointer; }
    .btn-admin.on { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
    .date-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .date-row button { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: 14px; cursor: pointer; }
    .date-row input { flex: 1; font-size: 15px; font-weight: 600; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; text-align: center; background: var(--card); color: var(--text); }
    .date-row .today { width: auto; padding: 0 10px; font-size: 12px; }
    .weather { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; display: flex; gap: 8px; align-items: center; }
    .w-icon { font-size: 20px; }
    .w-info { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); }
    .w-info b { font-size: 14px; color: var(--text); }
    .btn-sm { font-size: 11px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); color: var(--muted); cursor: pointer; white-space: nowrap; }
    .w-inputs { display: flex; gap: 6px; margin-top: 6px; }
    .w-inputs select, .w-inputs input { font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 8px; background: var(--card); color: var(--text); }
    .w-inputs select { flex: 1; } .w-inputs input { width: 72px; text-align: center; }
    .tabs { background: var(--card); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; position: sticky; top: 0; z-index: 19; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 11px 14px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; border-bottom: 2.5px solid transparent; flex-shrink: 0; }
    .tab.active { color: var(--text); border-bottom-color: var(--primary); }
    .tab .cnt { font-size: 11px; font-weight: normal; margin-left: 3px; }
    .tab .cnt.done { color: var(--teal); }
    .content { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 130px; }
    .sec { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .5px; padding: 10px 2px 2px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; min-height: 62px; }
    .card.dirty { border-color: var(--blue); }
    .info { flex: 1; min-width: 0; }
    .fname { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .fmeta { font-size: 12px; color: var(--muted); line-height: 1.5; }
    .fmeta .std { color: var(--blue); } .fmeta .use { color: var(--teal); font-weight: 600; } .fmeta .neg { color: #E53935; font-weight: 600; }
    .val { width: 120px; text-align: right; font-size: 18px; font-weight: 700; border: none; border-bottom: 1.5px solid var(--border); background: transparent; color: var(--text); padding: 4px; outline: none; font-variant-numeric: tabular-nums; }
    .val:focus { border-bottom-color: var(--primary); }
    .val.filled { border-bottom-color: var(--teal); }
    .val.warn { color: #E53935; border-bottom-color: #E53935; }
    .footer { background: var(--card); border-top: 1px solid var(--border); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; }
    .footer-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .prog { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
    .bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--teal); transition: width .3s; }
    .save { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; }
    .save.saving { background: #888; } .save.done { background: var(--teal); } .save.has { background: var(--blue); }
    .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 100; white-space: nowrap; }
    .toast.show { opacity: 1; }
    .loading { text-align: center; padding: 40px 0; color: var(--muted); }

    /* 관리자 모드 */
    .adm { background: var(--blue-bg); border: 1px solid var(--blue); border-radius: var(--radius); padding: 10px 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .adm input[type=text], .adm input[type=number] { border: none; border-bottom: 1px dashed var(--blue); background: transparent; font-size: 14px; padding: 3px; outline: none; color: var(--text); }
    .mini { min-width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 12px; padding: 0 6px; }
    .mini.red { color: var(--red); border-color: var(--red); }
    .mini.blue { color: var(--blue); border-color: var(--blue); }
    .acard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .acard .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .acard input[type=text], .acard input[type=number] { border: none; border-bottom: 1px dashed var(--border); background: transparent; font-size: 13px; padding: 3px; outline: none; color: var(--text); }
    .acard .nm { font-size: 14px; font-weight: 600; width: 100%; }
    .acard select { font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 3px; max-width: 160px; }
    .btns { display: flex; flex-direction: column; gap: 4px; }
    .addrow { display: flex; gap: 6px; }
    .addrow input { flex: 1; min-width: 0; font-size: 13px; border: 1px dashed var(--border); border-radius: 8px; padding: 8px 10px; background: transparent; }
    .addrow input.u { flex: 0 0 64px; }
    .addrow button { padding: 8px 12px; border: 1px solid var(--blue); border-radius: 8px; background: var(--blue-bg); color: var(--blue); cursor: pointer; font-size: 13px; white-space: nowrap; }
    .month-alert { margin: 8px 12px 0; background: #fff4e5; border: 1px solid #ffb74d; color: #7a4300; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
    .card.must { border: 2px solid #ffb74d; }
    /* 이상해 보이는 값 */
    .card.odd { border-color: var(--amber); background: #fffaf2; } .val.odd { color: var(--amber); border-bottom-color: var(--amber); } .fmeta .odd { color: var(--amber); font-weight: 600; }
    /* 설비점검 (검침 사이에 접힌 한 줄) */
    .ig { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
    .ig.bad { border-color: var(--red); } .ig.warn { border-color: var(--amber); } .ig.ok { border-color: #b8e0cf; }
    .ig-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; }
    .ig-h .ic { font-size: 16px; } .ig-h .t { flex: 1; min-width: 0; } .ig-h .t b { font-size: 14px; } .ig-h .t small { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .ig-h .t small .bd { color: var(--red); font-weight: 600; } .ig-h .t small .wn { color: var(--amber); font-weight: 600; }
    .ig-h .ar { color: #bbb; font-size: 14px; }
    .ist { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 14px; white-space: nowrap; border: 1px solid transparent; }
    .ist.ok { background: var(--teal-bg); color: var(--teal); } .ist.todo { background: #fff; border-color: var(--teal); color: var(--teal); cursor: pointer; }
    .ist.bad { background: var(--red); color: #fff; } .ist.warn { background: var(--amber-bg); color: var(--amber); }
    .ig-b { border-top: 1px dashed var(--border); padding: 4px 12px 10px; }
    .ir { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #f0f0f0; } .ir:last-child { border-bottom: none; }
    .ir .t { flex: 1; min-width: 0; font-size: 13px; } .ir .t .eq { font-size: 10px; color: var(--muted); } .ir .t small { display: block; color: #999; font-size: 11px; } .ir .t .au { color: var(--teal); font-size: 10px; font-weight: 700; }
    .seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }
    .seg button { width: 34px; height: 32px; border: none; border-left: 1px solid var(--border); background: #fff; font-size: 14px; color: #aaa; cursor: pointer; padding: 0; }
    .seg button:first-child { border-left: none; }
    .seg button.on.m0 { background: var(--teal); color: #fff; font-weight: 700; } .seg button.on.m1 { background: var(--red); color: #fff; font-weight: 700; }
    .seg button.on.m2 { background: var(--amber); color: #fff; font-weight: 700; } .seg button.on.m3 { background: var(--blue); color: #fff; font-weight: 700; }
    .inote { width: 100%; font-size: 13px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; margin: 0 0 4px; }
    .inote.need { border-color: var(--red); background: var(--red-bg); }
    .iremark { width: 100%; min-height: 54px; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 8px; font-family: inherit; }
    .tab .cnt .ic { color: var(--blue); }
    /* ---------- 출력 (A4) ---------- */
    #print-area { display: none; }
    .sheet { width: 190mm; margin: 0 auto 10mm; background: #fff; padding: 0; font-family: 'Malgun Gothic', sans-serif; color: #000; }
    .sheet h1 { text-align: center; font-size: 22pt; margin: 0 0 6mm; letter-spacing: 4px; }
    .sheet .top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2mm; font-size: 11pt; }
    .sheet .sign { border-collapse: collapse; font-size: 9pt; }
    .sheet .sign td { border: 1px solid #000; width: 18mm; text-align: center; height: 5mm; }
    .sheet .sign td.box { height: 14mm; }
    .sheet table.f { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
    .sheet table.f th, .sheet table.f td { border: 1px solid #000; padding: 1.3mm 1.5mm; }
    .sheet table.f th { background: #e8e8e8; }
    .sheet table.f td.c { text-align: center; }
    .sheet table.f td.rs { text-align: center; font-size: 13pt; width: 13mm; }
    .sheet .legend { font-size: 9pt; }
    .sheet .remark { height: 32mm; vertical-align: top; white-space: pre-wrap; }
    @media screen { .preview #print-area { display: block; background: #888; padding: 10mm 0; } .preview .sheet { padding: 10mm; box-shadow: 0 2px 8px rgba(0,0,0,.3); } }
    @media print {
      @page { size: A4 portrait; margin: 10mm; }
      body { background: #fff; }
      #app > :not(#print-area), .toast, .footer, #pt-bar, #pt-alarm, #pt-viewer, .pv-bar, .pm-ov { display: none !important; }
      #print-area { display: block !important; }
      .sheet { page-break-after: always; margin: 0; }
      .sheet:last-child { page-break-after: auto; }
    }
    .pm-ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 12px; }
    .pm { background: #fff; border-radius: 14px; padding: 16px; width: min(420px, 100%); }
    .pm h3 { margin: 0 0 10px; font-size: 16px; } .pm .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .pm input[type=date] { font-size: 14px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; }
    .pm .btn2 { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--primary); color: #fff; } .pm .btn2.sec { background: #fff; color: #333; border: 1px solid var(--border); }
    .pv-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; background: #1a1a1a; color: #fff; display: none; gap: 8px; align-items: center; padding: 8px 12px; }
    .preview .pv-bar { display: flex; } @media screen { .preview #print-area { padding-top: 64px !important; overflow-x: auto; } } .preview .wrap, .preview .footer { display: none; } .pv-bar button { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app" hidden>
    <div class="wrap">
      <div class="head">
        <div class="head-row">
          <span class="title">📟 설비검침</span>
          <span style="display:flex;gap:6px"><a class="btn-admin" href="table.html" style="text-decoration:none">📊 표</a><button class="btn-admin" onclick="pOpen()" title="설비점검일지 출력">🖨 점검일지</button>
          <button class="btn-admin" id="admin-btn" hidden onclick="toggleAdmin()">⚙ 항목</button></span>
        </div>
        <div class="date-row">
          <button onclick="shiftDate(-1)">◀</button>
          <input type="date" id="work-date" onchange="changeDate(this.value)">
          <button onclick="shiftDate(1)">▶</button>
          <button class="today" onclick="changeDate(todayStr())">오늘</button>
        </div>
        <div class="weather">
          <div class="w-icon" id="w-icon">⏳</div>
          <div class="w-info"><div>익산시 왕궁면 푸드폴리스</div><b id="w-temps">날씨 불러오는 중...</b> <span id="w-desc"></span></div>
          <button class="btn-sm" onclick="fetchWeather(true)">↺ 날씨</button>
        </div>
        <div class="w-inputs">
          <select id="w-sel" onchange="markDirty()">
            <option value="">날씨 선택</option>
            <option>맑음</option><option>구름 조금</option><option>구름 많음</option><option>흐림</option>
            <option>비</option><option>눈</option><option>안개</option><option>소나기</option><option>뇌우</option><option>이슬비</option>
          </select>
          <input type="number" id="t-min" placeholder="최저°C" step="0.1" inputmode="decimal" oninput="markDirty()">
          <input type="number" id="t-max" placeholder="최고°C" step="0.1" inputmode="decimal" oninput="markDirty()">
        </div>
      </div>
      <div id="month-alert" class="month-alert" hidden></div>
      <div class="tabs" id="tabs"></div>
      <div class="content" id="content"><div class="loading">불러오는 중...</div></div>
    </div>
    <div class="footer" id="footer">
      <div class="footer-in">
        <div class="prog"><div class="bar"><div id="prog-fill" style="width:0%"></div></div><span id="prog-text">0 / 0</span></div>
        <button class="save" id="save-btn" onclick="saveDay()">저장</button>
      </div>
    </div>
    <div class="pv-bar"><b style="flex:1">설비점검일지 미리보기</b><button onclick="window.print()">🖨 인쇄</button><button style="background:#555;color:#fff" onclick="pvClose()">✕ 닫기</button></div>
    <div id="print-area"></div>
    <div class="pm-ov" id="pm" hidden onclick="if(event.target===this)this.hidden=true">
      <div class="pm"><h3>🖨 설비점검일지 출력</h3>
        <div class="row"><input type="date" id="p-from"> ~ <input type="date" id="p-to"></div>
        <div class="row"><button class="btn-sm" onclick="pRange('day')">이 날짜</button><button class="btn-sm" onclick="pRange('week')">이번 주</button><button class="btn-sm" onclick="pRange('month')">이번 달</button><button class="btn-sm" onclick="pRange('prev')">지난달</button>
          <label style="font-size:12px;color:var(--muted);margin-left:auto"><input type="checkbox" id="p-only" checked> 기록 있는 날만</label></div>
        <div class="row" style="margin-top:12px"><button class="btn2 sec" onclick="buildPrint(true)">미리보기</button><button class="btn2" onclick="buildPrint(false)">🖨 인쇄</button></div>
        <div style="font-size:11px;color:var(--muted);line-height:1.6">· 하루씩 A4 한 장 · 인쇄 창에서 「PDF로 저장」도 가능<br>· 비고가 빈 「전일 사용량 비교」 항목은 검침값으로 사용량을 자동으로 적음<br>· 점검 항목 바꾸기: <a href="../insp/">설비점검일지 → 항목 관리</a> (관리자)</div>
      </div></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    let sb = null, me = null;
    const isAdmin = () => !!(me && me.role === 'admin');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad2 = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const todayStr = () => ymd(new Date());
    const nf = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 2 });
    const errMsg = e => (e && (e.message || e.error_description || e.error)) || String(e);
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

    // ---------------- 데이터 ----------------
    let FIELDS = [];          // meter_fields (활성 항목)
    let ALLFIELDS = [];       // 비활성 포함
    let DAYS = {};            // d -> { weather, temp_min, temp_max, v }
    let SORTED_DAYS = [];     // 날짜 오름차순
    let curDate = todayStr();
    let values = {};          // 화면의 현재 값 (항목ID -> 문자열)
    let dirty = new Set();    // 바뀐 항목ID
    let weatherDirty = false;
    let activeTab = 0;
    let adminMode = false;
    let TABS = [];            // [{ name, sections: [{ name, fields: [...] }] }]

    async function fetchAll(table, cols, order) {
      const out = []; let from = 0;
      while (true) {
        const { data, error } = await sb.from(table).select(cols).order(order).range(from, from + 999);
        if (error) throw error;
        out.push(...data); if (data.length < 1000) break; from += 1000;
      }
      return out;
    }

    async function loadAll() {
      const [f, d, it] = await Promise.all([
        fetchAll('meter_fields', '*', 'sort'),
        fetchAll('meter_daily', 'd, weather, temp_min, temp_max, v', 'd'),
        fetchAll('insp_items', '*', 'sort').catch(() => [])
      ]);
      INSP_ITEMS = (it || []).filter(x => x.active);
      ALLFIELDS = f;
      FIELDS = f.filter(x => x.active);
      DAYS = Object.fromEntries(d.map(r => [r.d, r]));
      SORTED_DAYS = d.map(r => r.d);
      buildTabs();
    }

    function buildTabs() {
      TABS = [];
      FIELDS.slice().sort((a, b) => a.sort - b.sort).forEach(f => {
        let t = TABS.find(x => x.name === f.tab); if (!t) TABS.push(t = { name: f.tab, sections: [] });
        let s = t.sections.find(x => x.name === f.section); if (!s) t.sections.push(s = { name: f.section, fields: [] });
        s.fields.push(f);
      });
      if (activeTab >= TABS.length) activeTab = 0;
    }

    // 이 날짜 이전의 가장 최근 값
    function prevValue(fid, date) {
      for (let i = SORTED_DAYS.length - 1; i >= 0; i--) {
        const d = SORTED_DAYS[i];
        if (d >= date) continue;
        const v = (DAYS[d].v || {})[fid];
        if (v !== undefined && v !== null && v !== '') return { d, v: Number(v) };
      }
      return null;
    }

    // ---------------- 설비점검일지 (검침 사이에 접힌 한 줄로) ----------------
    // 점검 결과는 설비점검일지(insp_daily)에 그대로 저장 → 출력은 설비점검일지 메뉴에서 지금 양식 그대로
    const MARKS = [['○', '양호'], ['Ⅹ', '불량'], ['△', '정비필요'], ['◎', '정비완료']];
    // 점검 묶음: 설비 이름으로 묶고, 그 묶음을 붙일 검침 칸(그 칸 바로 아래). 실외기는 기계실·외곽 두 곳에 같은 묶음
    const INSP_GROUPS = [
      { key: 'water', name: '수도 계량기 점검', eq: ['수도 계량기'], after: ['상수도50A', '상수도40A'] },
      { key: 'gasreg', name: '가스 정압기 점검', eq: ['가스 정압기'], after: ['가스식당', '가스보일러'] },
      { key: 'boiler', name: '보일러 점검', eq: ['관류 보일러', '보일러 연수기', '보일러 청관제', '열수탱크'], after: ['보일러2급수', '보일러1급수'] },
      { key: 'comp', name: '컴프레셔 점검', eq: ['컴프레셔'], after: ['컴프레셔2운전', '컴프레셔1운전'] },
      { key: 'pump', name: '저수조·급수펌프 점검', eq: ['저수조', '급수펌프'], after: ['부스타펌프압력'] },
      { key: 'hot', name: '온수탱크 점검', eq: ['온수탱크'], after: ['전기온수기온도', '전기온수기압력'] },
      { key: 'elec', name: '수변전 점검', eq: ['변압기', '큐비클', '계량기'], after: ['역률', '최대전력', '심야지침'] },
      { key: 'odu', name: '옥외 실외기 점검', eq: ['옥외 실외기'], after: [], both: true /* 실외기 섹션이 있는 모든 탭의 마지막 실외기 칸 아래 */ }
    ];
    // 검침하면 같이 ○ 되는 점검: 관련 검침값이 다 들어가고 정상 범위면 자동 ○ (직접 누른 건 안 건드림)
    const INSP_AUTO = [
      { eq: '수도 계량기', ids: ['상수도40A', '상수도50A'], cum: true },
      { eq: '관류 보일러', ct: '급수', ids: ['보일러1급수', '보일러2급수'], cum: true },
      { eq: '급수펌프', ids: ['부스타펌프압력'], range: [3.7, 4.7] },
      { eq: '온수탱크', ids: ['전기온수기압력', '전기온수기온도'], range: [3.7, 4.7] },
      { eq: '계량기', ids: ['전력사용량'] }
    ];
    let INSP_ITEMS = [], irec = null, isaved = null, iAuto = new Set(), iOpen = new Set(), iLoadFail = false;
    const iDirty = () => !!(irec && isaved && JSON.stringify(irec) !== JSON.stringify(isaved));
    function iGroupItems(g) { return INSP_ITEMS.filter(it => g.eq.includes(it.equipment)); }
    function iOthers() { const used = new Set(INSP_GROUPS.flatMap(g => iGroupItems(g).map(i => i.id))); return INSP_ITEMS.filter(i => !used.has(i.id)); }
    async function loadInsp() {
      irec = null; isaved = null; iAuto = new Set(); iLoadFail = false;
      if (!INSP_ITEMS.length) return;
      const ds = curDate, { data, error } = await sb.from('insp_daily').select('*').eq('d', ds).maybeSingle();
      if (ds !== curDate) return;
      if (error) { iLoadFail = true; return; }
      const r = data || {};
      irec = { results: { ...(r.results || {}) }, notes: { ...(r.notes || {}) }, remark: r.remark || '', inspector: r.inspector || '' };
      isaved = JSON.parse(JSON.stringify(irec));
      if (!irec.inspector && me) { irec.inspector = me.name; isaved.inspector = me.name; }
      applyAuto();
    }
    const has = id => values[id] !== undefined && values[id] !== '' && !isNaN(values[id]);
    function autoOk(a) {
      if (!a.ids.every(has)) return false;
      if (a.range && !(Number(values[a.ids[0]]) >= a.range[0] && Number(values[a.ids[0]]) <= a.range[1])) return false;
      if (a.cum) for (const id of a.ids) { const p = prevValue(id, curDate); if (p && Number(values[id]) < p.v) return false; }
      return !a.ids.some(id => oddOf(FIELDS.find(f => f.id === id)));
    }
    function applyAuto() { // 검침값이 들어가 정상이면 ○, 지워지거나 이상해지면 자동으로 넣었던 ○만 뺌
      if (!irec) return;
      INSP_AUTO.forEach(a => INSP_ITEMS.filter(it => it.equipment === a.eq && (!a.ct || it.content.includes(a.ct))).forEach(it => {
        const ok = autoOk(a), cur = irec.results[it.id];
        if (ok && !cur) { irec.results[it.id] = '○'; iAuto.add(it.id); }
        else if (!ok && iAuto.has(it.id) && cur === '○') { delete irec.results[it.id]; iAuto.delete(it.id); }
      }));
    }
    function iStat(items) {
      const R = irec ? irec.results : {}, n = items.length, done = items.filter(i => R[i.id]).length, bad = items.filter(i => R[i.id] === 'Ⅹ'), warn = items.filter(i => R[i.id] === '△');
      return { n, done, bad, warn };
    }
    function iGroupHtml(g, items, pos) {
      if (!items.length) return '';
      if (!irec) return iLoadFail ? `<div class="ig"><div class="ig-h"><span class="ic">🔍</span><div class="t"><b>${esc(g.name)}</b><small>점검 기록을 불러오지 못했습니다</small></div></div></div>` : '';
      const st = iStat(items), gid = g.key + (pos || ''), open = iOpen.has(gid), R = irec.results, N = irec.notes;
      const issues = items.filter(i => R[i.id] === 'Ⅹ' || R[i.id] === '△').map(i => `<span class="${R[i.id] === 'Ⅹ' ? 'bd' : 'wn'}">${esc(i.content.replace(/\s*(여부|상태)?\s*(확인|점검)$/, ''))} ${R[i.id]}${N[i.id] ? ` 「${esc(N[i.id])}」` : ''}</span>`);
      const cls = st.bad.length ? 'bad' : st.warn.length ? 'warn' : st.done === st.n ? 'ok' : '';
      const chip = st.bad.length ? `<span class="ist bad">Ⅹ ${st.bad.length}</span>` : st.warn.length ? `<span class="ist warn">△ ${st.warn.length}</span>`
        : st.done === st.n ? `<span class="ist ok">✓ 정상</span>` : `<span class="ist todo" onclick="event.stopPropagation();iAllGood('${g.key}')">모두 ○</span>`;
      const sub = issues.length ? issues.join(' · ') : `${st.n}항목${st.done && st.done < st.n ? ` · ${st.done}개 체크` : ''}${items.some(i => iAuto.has(i.id)) ? ' · 검침으로 자동 ○ 포함' : ''}${g.both ? ' · 모든 실외기 (기계실·외곽·공장동 어디서 체크해도 같음)' : ''}`;
      let h = `<div class="ig ${cls}" id="ig-${gid}"><div class="ig-h" onclick="iToggle('${gid}')"><span class="ic">🔍</span><div class="t"><b>${esc(g.name)}</b><small>${sub}</small></div>${chip}<span class="ar">${open ? '▾' : '›'}</span></div>`;
      if (open) h += `<div class="ig-b">${items.map(it => { const v = R[it.id] || '', need = v === 'Ⅹ' || v === '△';
        return `<div class="ir"><div class="t">${g.eq.length > 1 ? `<div class="eq">${esc(it.equipment)}</div>` : ''}${esc(it.content)}${iAuto.has(it.id) && v === '○' ? ' <span class="au">검침 자동</span>' : ''}<small>기준: ${esc(it.standard)}</small></div>
          <div class="seg">${MARKS.map(([m, l], k) => `<button class="m${k} ${v === m ? 'on' : ''}" title="${l}" onclick="iMark('${esc(it.id)}','${m}','${gid}')">${m}</button>`).join('')}</div></div>
          ${need || N[it.id] ? `<input class="inote ${need && !N[it.id] ? 'need' : ''}" placeholder="비고 — 무엇이 문제인지 (일지에 나옴)" value="${esc(N[it.id] || '')}" oninput="irec.notes['${esc(it.id)}']=this.value;this.classList.toggle('need',!this.value);renderFooter()">` : ''}`; }).join('')}
        <div style="text-align:right;margin-top:6px"><button class="btn-sm" onclick="iAllGood('${g.key}')">남은 것 모두 ○</button></div></div>`;
      return h + '</div>';
    }
    function iToggle(gid) { iOpen.has(gid) ? iOpen.delete(gid) : iOpen.add(gid); renderContent(); }
    function iMark(id, m, gid) {
      if (!irec) return; irec.results[id] = irec.results[id] === m ? '' : m; if (!irec.results[id]) delete irec.results[id]; iAuto.delete(id);
      if (m === 'Ⅹ' || m === '△') iOpen.add(gid);
      renderTabs(); renderContent(); renderFooter();
    }
    function iAllGood(key) {
      if (!irec) return; const g = INSP_GROUPS.find(x => x.key === key), items = g ? iGroupItems(g) : iOthers();
      items.forEach(i => { if (!irec.results[i.id]) irec.results[i.id] = '○'; }); renderTabs(); renderContent(); renderFooter();
    }
    function anchorOf(g, t) { // 이 탭에서 점검 묶음을 붙일 검침 칸
      if (!t) return null;
      if (g.both) { const ss = t.sections.filter(x => /실외기/.test(x.name) && x.fields.length); return ss.length ? ss[ss.length - 1].fields[ss[ss.length - 1].fields.length - 1].id : null; }
      const ids = new Set(t.sections.flatMap(x => x.fields.map(f => f.id))); return g.after.find(id => ids.has(id)) || null;
    }
    function iTabItems(t) { // 이 탭에 붙는 점검 항목 (실외기처럼 두 탭에 같은 묶음이면 양쪽에 셈)
      const ids = new Set(t.sections.flatMap(s => s.fields.map(f => f.id))), out = [];
      INSP_GROUPS.forEach(g => { if (anchorOf(g, t)) out.push(...iGroupItems(g)); });
      if (t === TABS[0]) out.push(...iOthers().filter(i => !INSP_GROUPS.some(g => iGroupItems(g).includes(i))));
      return [...new Set(out)];
    }
    // 이상해 보이는 값: 누적 지침은 하루 사용량이 평소(최근 7번 중앙값)의 2배 넘거나 1/3 아래, 그 밖의 값은 기준값 ±15% 또는 평소 값과 크게 다름
    const median = a => { const b = a.slice().sort((x, y) => x - y); return b.length ? (b.length % 2 ? b[(b.length - 1) / 2] : (b[b.length / 2 - 1] + b[b.length / 2]) / 2) : null; };
    function history(fid, n) { const out = []; for (let i = SORTED_DAYS.length - 1; i >= 0 && out.length < n; i--) { const d = SORTED_DAYS[i]; if (d >= curDate) continue; const v = (DAYS[d].v || {})[fid]; if (v !== undefined && v !== null && v !== '') out.push({ d, v: Number(v) }); } return out; }
    const dayGap = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5);
    function oddOf(f) {
      if (!f) return null; const v = values[f.id]; if (v === undefined || v === '' || isNaN(v)) return null; const x = Number(v);
      if (f.cumulative) {
        const H = history(f.id, 9); if (H.length < 4) return null; const p = H[0], gap = Math.max(1, dayGap(curDate, p.d)), u = (x - p.v) / gap; if (u < 0) return null;
        const per = []; for (let i = 0; i < H.length - 1; i++) { const g2 = Math.max(1, dayGap(H[i].d, H[i + 1].d)), q = (H[i].v - H[i + 1].v) / g2; if (q >= 0) per.push(q); }
        const m = median(per); if (!m || m <= 0) return null;
        if (u > m * 2) return `평소 하루 ${nf.format(m)}의 ${nf.format(Math.round(u / m * 10) / 10)}배`;
        if (u < m / 3 && gap === 1) return `평소 하루 ${nf.format(m)}보다 아주 적음`;
        return null;
      }
      if (f.std_value !== null && f.std_value !== undefined && f.std_value !== 0 && Math.abs(x - f.std_value) > Math.abs(f.std_value) * 0.15) return `기준 ${nf.format(f.std_value)}에서 벗어남`;
      const H = history(f.id, 7).map(h => h.v); if (H.length < 4) return null; const m = median(H), dev = Math.abs(x - m);
      const minAbs = /MPa|bar/i.test(f.unit || '') ? 0.1 : /°C|℃/.test(f.unit || '') ? 3 : /%/.test(f.unit || '') ? 5 : 0;
      if (dev > Math.abs(m) * 0.3 && dev > minAbs) return `평소 ${nf.format(m)} → 오늘 ${nf.format(x)}`;
      return null;
    }

    // ---------------- 설비점검일지 출력 (A4 · 설비점검일지 양식 그대로) ----------------
    const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
    const korDate = ds => { const d = new Date(ds + 'T00:00:00'); return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}. (${WEEK[d.getDay()]})`; };
    const addD = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
    function pOpen() { if (!document.getElementById('p-from').value) pRange('day'); document.getElementById('pm').hidden = false; }
    function pRange(k) {
      let a = curDate, b = curDate;
      if (k === 'week') { const d = new Date(curDate + 'T00:00:00'), w = (d.getDay() + 6) % 7; a = addD(curDate, -w); b = addD(a, 6); }
      if (k === 'month') { a = curDate.slice(0, 8) + '01'; const d = new Date(a + 'T00:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); b = ymd(d); }
      if (k === 'prev') { const d = new Date(curDate.slice(0, 8) + '01T00:00:00'); d.setDate(0); b = ymd(d); a = b.slice(0, 8) + '01'; }
      document.getElementById('p-from').value = a; document.getElementById('p-to').value = b;
    }
    function readingOn(ds, ids, back) { for (let i = back ? 1 : 0; i <= 10; i++) { const d = addD(ds, -i), v = (DAYS[d] || {}).v; if (v && ids.every(k => v[k] !== undefined && v[k] !== null && v[k] !== '')) return { d, sum: ids.reduce((s2, k) => s2 + Number(v[k]), 0) }; } return null; }
    function refText(key, ds) {
      if (!key) return '';
      if (key === 'elec') { const v = ((DAYS[ds] || {}).v || {})['전력사용량']; return v === undefined || v === null ? '' : `전력사용량 ${nf.format(v)} kWh`; }
      const ids = key === 'water' ? ['상수도40A', '상수도50A'] : ['보일러1급수', '보일러2급수'];
      const a = readingOn(ds, ids, false); if (!a || a.d !== ds) return ''; const b = readingOn(ds, ids, true); if (!b) return '';
      return `전일 사용량 ${nf.format(Math.round((a.sum - b.sum) * 1000) / 1000)} ㎥`;
    }
    function sheetHtml(ds, r) {
      r = r || { results: {}, notes: {}, remark: '', inspector: '' };
      const rows = INSP_ITEMS.map(it => ({ it }));
      rows.forEach((x, i) => {
        if (i && rows[i - 1].it.area === x.it.area) x.areaSpan = 0; else { let n = 1; while (rows[i + n] && rows[i + n].it.area === x.it.area) n++; x.areaSpan = n; }
        if (i && rows[i - 1].it.area === x.it.area && rows[i - 1].it.equipment === x.it.equipment) x.eqSpan = 0;
        else { let n = 1; while (rows[i + n] && rows[i + n].it.area === x.it.area && rows[i + n].it.equipment === x.it.equipment) n++; x.eqSpan = n; }
      });
      const body = rows.map(({ it, areaSpan, eqSpan }) => `<tr>
        ${areaSpan ? `<td class="c" rowspan="${areaSpan}"><b>${esc(it.area)}</b></td>` : ''}${eqSpan ? `<td class="c" rowspan="${eqSpan}">${esc(it.equipment)}</td>` : ''}
        <td>${esc(it.content)}</td><td>${esc(it.standard)}</td><td class="rs">${esc((r.results || {})[it.id] || '')}</td>
        <td style="font-size:8.5pt">${esc((r.notes || {})[it.id] || refText(it.ref_key, ds))}</td></tr>`).join('');
      return `<div class="sheet"><h1>유틸리티 일일 점검일지</h1>
        <div class="top"><div><b>점검일자 :</b> ${korDate(ds)}<br><span class="legend">양호 : ○ &nbsp; 불량 : Ⅹ &nbsp; 정비필요 : △ &nbsp; 정비완료 : ◎</span></div>
          <table class="sign"><tr><td>점검자</td><td>확 인</td></tr><tr><td class="box">${esc(r.inspector || '')}</td><td class="box"></td></tr></table></div>
        <table class="f"><colgroup><col style="width:15mm"><col style="width:24mm"><col><col style="width:38mm"><col style="width:13mm"><col style="width:34mm"></colgroup>
          <tr><th>구 분</th><th>설 비</th><th>점검내용</th><th>기 준</th><th>결과</th><th>비 고</th></tr>${body}
          <tr><th>특이사항</th><td colspan="5" class="remark">${esc(r.remark || '')}</td></tr></table></div>`;
    }
    function fitSheets() { const MAXH = 266 * 96 / 25.4; document.querySelectorAll('#print-area .sheet').forEach(sh => { sh.style.zoom = ''; const cs = getComputedStyle(sh), pd = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom), hh = sh.scrollHeight - pd; if (hh > MAXH) sh.style.zoom = (MAXH / hh).toFixed(3); }); }
    window.addEventListener('beforeprint', () => { if (document.querySelector('#print-area .sheet')) fitSheets(); });
    function pvClose() { document.body.classList.remove('preview'); document.getElementById('print-area').innerHTML = ''; }
    async function buildPrint(previewOnly) {
      if (!INSP_ITEMS.length) return alert('점검 항목이 없습니다.');
      const from = document.getElementById('p-from').value, to = document.getElementById('p-to').value || from;
      if (!from) return alert('날짜를 고르세요.'); if (to < from) return alert('끝 날짜가 시작 날짜보다 빠릅니다.');
      const days = []; for (let d = from; d <= to; d = addD(d, 1)) days.push(d);
      if (days.length > 62) return alert('한 번에 62일까지 인쇄할 수 있습니다.');
      if (iDirty() && from <= curDate && curDate <= to && !confirm('이 날짜 점검을 아직 저장하지 않았습니다. 저장된 내용으로 인쇄할까요? (먼저 저장하려면 취소)')) return;
      const { data, error } = await sb.from('insp_daily').select('*').gte('d', from).lte('d', to).order('d'); if (error) return alert('불러오기 실패: ' + errMsg(error));
      const byD = Object.fromEntries((data || []).map(r => [r.d, r])), only = document.getElementById('p-only').checked, list = days.filter(d => !only || byD[d]);
      if (!list.length) return alert('이 기간에 저장된 점검 기록이 없습니다. 「기록 있는 날만」을 끄면 빈 양식으로 인쇄합니다.');
      document.getElementById('pm').hidden = true;
      document.getElementById('print-area').innerHTML = list.map(d => sheetHtml(d, byD[d])).join('');

    }

    // ---------------- 날짜 ----------------
    function confirmLeave() { return !(dirty.size || weatherDirty || iDirty()) || confirm('저장하지 않은 입력이 있습니다. 버리고 이동할까요?'); }
    function shiftDate(n) { const d = new Date(curDate + 'T00:00:00'); d.setDate(d.getDate() + n); changeDate(ymd(d)); }
    function changeDate(ds) {
      if (!ds) return;
      if (ds !== curDate && !confirmLeave()) { document.getElementById('work-date').value = curDate; return; }
      curDate = ds; loadDay();
    }
    function loadDay() {
      document.getElementById('work-date').value = curDate;
      const r = DAYS[curDate] || {};
      values = {};
      Object.entries(r.v || {}).forEach(([k, v]) => values[k] = String(v));
      dirty = new Set(); weatherDirty = false;
      document.getElementById('w-sel').value = r.weather || '';
      document.getElementById('t-min').value = r.temp_min ?? '';
      document.getElementById('t-max').value = r.temp_max ?? '';
      if (!r.weather && r.temp_min == null) fetchWeather(false);
      else showWeatherCard(r.weather, r.temp_min, r.temp_max, '저장된 값');
      renderMonthAlert();
      irec = null; isaved = null;
      renderTabs(); renderContent(); renderFooter();
      loadInsp().then(() => { renderTabs(); renderContent(); renderFooter(); });
    }
    // ---------------- 월초 검침 알림 ----------------
    // 폐수동·공조냉동 한 달 사용량 = 매월 1일 지침 차이 → 1일이 쉬는 날이면 마지막 출근일·첫 출근일에 꼭 검침
    const MONTH_METERS = ['폐수전력', '냉장1전력', '냉동1전력', '냉동2전력', '냉동3전력', '내포장공조전력', '파쇄공조전력', '파쇄냉장전력', '방혈1전력', '방혈2전력', '자숙1전력', '자숙2전력', '자숙3전력'];
    let monthAlertOn = false;
    function renderMonthAlert() {
      const el = document.getElementById('month-alert'), ds = curDate, off = Portal.isOffDay, add = Portal.addDaysStr;
      const wd = d => '일월화수목금토'[new Date(d + 'T00:00:00').getDay()], md = d => `${Number(d.slice(5, 7))}/${Number(d.slice(8))}(${wd(d)})`;
      let msg = '';
      if (!off(ds)) {
        const next1 = (() => { const d = new Date(ds + 'T00:00:00'); return `${d.getMonth() === 11 ? d.getFullYear() + 1 : d.getFullYear()}-${String(d.getMonth() === 11 ? 1 : d.getMonth() + 2).padStart(2, '0')}-01`; })();
        const this1 = ds.slice(0, 8) + '01';
        let lastWd = add(next1, -1); while (off(lastWd)) lastWd = add(lastWd, -1);
        let firstWd = this1; while (off(firstWd)) firstWd = add(firstWd, 1);
        if (ds === this1) msg = `오늘은 ${Number(ds.slice(5, 7))}월 1일입니다. <b>폐수 전력량과 공조냉동 계량기(12개)</b>를 꼭 검침해 주세요. (한 달 사용량 계산 기준)`;
        else if (off(next1) && ds === lastWd) msg = `다음 달 1일 ${md(next1)}은 쉬는 날입니다. 오늘(마지막 출근일) <b>폐수 전력량과 공조냉동 계량기(12개)</b>를 꼭 검침해 주세요. 쉬고 온 첫 출근일에도 한 번 더 검침합니다.`;
        else if (off(this1) && ds === firstWd) msg = `이번 달 1일 ${md(this1)}은 쉬는 날이었습니다. 오늘(첫 출근일) <b>폐수 전력량과 공조냉동 계량기(12개)</b>를 꼭 검침해 주세요. 1일 지침은 앞뒤 검침값으로 나눠 계산됩니다.`;
      }
      monthAlertOn = !!msg;
      el.hidden = !msg; el.innerHTML = msg ? `📌 ${msg}` : '';
    }

    // ---------------- 날씨 (open-meteo, 회사망에서 막히면 직접 입력) ----------------
    const WCODE = { 0: '맑음', 1: '맑음', 2: '구름 조금', 3: '흐림', 45: '안개', 48: '안개', 51: '이슬비', 53: '이슬비', 55: '이슬비', 61: '비', 63: '비', 65: '비', 71: '눈', 73: '눈', 75: '눈', 80: '소나기', 81: '소나기', 82: '소나기', 95: '뇌우', 96: '뇌우', 99: '뇌우' };
    const WICON = { '맑음': '☀️', '구름 조금': '🌤️', '구름 많음': '⛅', '흐림': '☁️', '안개': '🌫️', '이슬비': '🌦️', '비': '🌧️', '눈': '🌨️', '소나기': '🌦️', '뇌우': '⛈️' };
    function showWeatherCard(desc, tmin, tmax, note) {
      document.getElementById('w-icon').textContent = WICON[desc] || '🌡️';
      document.getElementById('w-temps').textContent = (tmin != null && tmax != null) ? `${tmin}° / ${tmax}°C` : (desc || '날씨 정보 없음');
      document.getElementById('w-desc').textContent = [desc, note].filter(Boolean).join(' · ');
    }
    async function fetchWeather(force) {
      const ds = curDate;
      document.getElementById('w-temps').textContent = '날씨 불러오는 중...';
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=35.8964&longitude=126.9396&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Asia%2FSeoul&start_date=${ds}&end_date=${ds}`;
        const res = await fetch(url);
        const j = await res.json();
        if (!j.daily) throw new Error(j.reason || '날씨 없음');
        if (ds !== curDate) return;
        const tmin = Math.round(j.daily.temperature_2m_min[0] * 10) / 10, tmax = Math.round(j.daily.temperature_2m_max[0] * 10) / 10;
        const desc = WCODE[j.daily.weathercode[0]] || '흐림';
        showWeatherCard(desc, tmin, tmax, '자동');
        const sel = document.getElementById('w-sel'), mn = document.getElementById('t-min'), mx = document.getElementById('t-max');
        if (force || !sel.value) sel.value = desc;
        if (force || mn.value === '') mn.value = tmin;
        if (force || mx.value === '') mx.value = tmax;
        weatherDirty = true; renderFooter();
      } catch (e) {
        document.getElementById('w-icon').textContent = '?';
        document.getElementById('w-temps').textContent = '날씨 자동 확인 불가';
        document.getElementById('w-desc').textContent = '아래에 직접 입력해 주세요';
      }
    }
    function markDirty() { weatherDirty = true; renderFooter(); }

    // ---------------- 화면 ----------------
    function tabCount(t) {
      let total = 0, filled = 0;
      t.sections.forEach(s => s.fields.forEach(f => { total++; if (values[f.id] !== undefined && values[f.id] !== '') filled++; }));
      return { total, filled };
    }
    function renderTabs() {
      document.getElementById('tabs').innerHTML = TABS.map((t, i) => {
        const c = tabCount(t);
        const ii = irec ? iTabItems(t) : [], is = iStat(ii);
        return `<div class="tab ${i === activeTab ? 'active' : ''}" onclick="switchTab(${i})">${esc(t.name)}<span class="cnt ${c.filled === c.total ? 'done' : ''}">${c.filled}/${c.total}</span>${is.bad.length || is.warn.length ? `<b style="color:var(--red);font-size:11px" title="점검 이상 ${is.bad.length + is.warn.length}건"> !</b>` : ''}</div>`;
      }).join('') + (adminMode ? `<div class="tab" onclick="addTab()">＋ 탭</div>` : '');
    }
    function switchTab(i) { activeTab = i; renderTabs(); renderContent(); renderFooter(); window.scrollTo({ top: 0 }); }

    function metaHtml(f) {
      const parts = [esc(f.unit)];
      if (f.std_value !== null && f.std_value !== undefined) parts.push(`<span class="std">기준 ${nf.format(f.std_value)}${esc(f.unit)}</span>`);
      const p = prevValue(f.id, curDate);
      if (p) {
        const dd = p.d.slice(5).replace('-', '/');
        parts.push(`전 ${nf.format(p.v)}${p.d !== prevDay(curDate) ? ` (${dd})` : ''}`);
        const cur = values[f.id];
        if (f.cumulative && cur !== undefined && cur !== '' && !isNaN(cur)) {
          const u = Number(cur) - p.v;
          parts.push(u < 0 ? `<span class="neg">⚠ 전보다 ${nf.format(-u)} 작음</span>` : `<span class="use">사용 ${nf.format(u)}</span>`);
        }
      }
      const od = oddOf(f); if (od) parts.push(`<span class="odd">⚠ ${od}</span>`);
      return parts.join(' · ');
    }
    function prevDay(ds) { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() - 1); return ymd(d); }

    function renderContent() {
      const c = document.getElementById('content');
      const t = TABS[activeTab];
      if (!t) { c.innerHTML = '<div class="loading">항목이 없습니다.' + (isAdmin() ? ' 위의 ⚙ 항목 관리에서 추가하세요.' : '') + '</div>'; return; }
      if (adminMode) { renderAdmin(); return; }
      let h = '';
      t.sections.forEach(s => {
        h += `<div class="sec">${esc(s.name)}</div>`;
        s.fields.forEach(f => {
          const v = values[f.id] ?? '';
          const p = prevValue(f.id, curDate);
          const warn = f.cumulative && v !== '' && p && Number(v) < p.v;
          const must = monthAlertOn && MONTH_METERS.includes(f.id), od = oddOf(f);
          h += `<div class="card ${dirty.has(f.id) ? 'dirty' : ''} ${must ? 'must' : ''} ${od ? 'odd' : ''}" id="card-${esc(f.id)}">
            <div class="info"><div class="fname">${must ? '📌 ' : ''}${esc(f.name)}</div><div class="fmeta" id="meta-${esc(f.id)}">${metaHtml(f)}</div></div>
            <input class="val ${v !== '' ? 'filled' : ''} ${warn ? 'warn' : ''} ${od && !warn ? 'odd' : ''}" type="number" step="any" inputmode="decimal" placeholder="—"
              value="${esc(v)}" data-id="${esc(f.id)}">
          </div>`;
          if (irec || iLoadFail) INSP_GROUPS.forEach(g => { // 이 검침 칸 바로 아래에 붙는 점검 묶음
            if (anchorOf(g, t) === f.id) h += iGroupHtml(g, iGroupItems(g), '');
          });
        });
      });
      if (irec && activeTab === 0 && iOthers().length) h += `<div class="sec">기타 점검</div>` + iGroupHtml({ key: 'etc', name: '기타 점검', eq: [] }, iOthers(), '');
      if (irec && iTabItems(t).length) h += `<div class="sec">점검 특이사항 · 점검자</div><textarea class="iremark" placeholder="설비점검일지 특이사항 (일지에 나옴)" oninput="irec.remark=this.value;renderFooter()">${esc(irec.remark)}</textarea>
        <div class="fmeta" style="display:flex;gap:6px;align-items:center">점검자 <input style="font-size:14px;border:none;border-bottom:1px solid var(--border);padding:3px;width:120px" value="${esc(irec.inspector)}" oninput="irec.inspector=this.value;renderFooter()"> <a href="#" onclick="pOpen();return false" style="margin-left:auto;font-size:12px">🖨 설비점검일지 출력 →</a></div>`;
      c.innerHTML = h;
      c.querySelectorAll('input.val').forEach(inp => {
        inp.addEventListener('input', () => onInput(inp));
        inp.addEventListener('focus', () => { inp.select(); setTimeout(() => inp.closest('.card').scrollIntoView({ block: 'center', behavior: 'smooth' }), 250); });
        inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const all = [...c.querySelectorAll('input.val')]; const i = all.indexOf(inp);
            if (all[i + 1]) all[i + 1].focus(); else inp.blur();
          }
        });
      });
    }

    function onInput(inp) {
      const id = inp.dataset.id, v = inp.value.trim();
      const orig = ((DAYS[curDate] || {}).v || {})[id];
      values[id] = v;
      const changed = String(orig ?? '') !== v;
      if (changed) dirty.add(id); else dirty.delete(id);
      inp.classList.toggle('filled', v !== '');
      const f = FIELDS.find(x => x.id === id);
      const p = prevValue(id, curDate);
      const wn = !!(f.cumulative && v !== '' && p && Number(v) < p.v), od = oddOf(f);
      inp.classList.toggle('warn', wn); inp.classList.toggle('odd', !!od && !wn);
      document.getElementById('meta-' + id).innerHTML = metaHtml(f);
      inp.closest('.card').classList.toggle('dirty', changed); inp.closest('.card').classList.toggle('odd', !!od);
      if (irec) { const before = JSON.stringify(irec.results); applyAuto(); if (JSON.stringify(irec.results) !== before) refreshGroups(); }
      renderTabs(); renderFooter();
    }

    function refreshGroups() { // 입력 중 포커스를 잃지 않게 점검 묶음 줄만 다시 그림
      const t = TABS[activeTab]; if (!t) return; const ids = new Set(t.sections.flatMap(s => s.fields.map(f => f.id)));
      INSP_GROUPS.forEach(g => { if (!anchorOf(g, t)) return; const el = document.getElementById('ig-' + g.key); if (el) el.outerHTML = iGroupHtml(g, iGroupItems(g), ''); });
    }
    function renderFooter() {
      let total = 0, filled = 0;
      TABS.forEach(t => { const c = tabCount(t); total += c.total; filled += c.filled; });
      document.getElementById('prog-fill').style.width = (total ? Math.round(filled / total * 100) : 0) + '%';
      const is = irec ? iStat(INSP_ITEMS) : null;
      document.getElementById('prog-text').textContent = `검침 ${filled} / ${total}` + (is ? ` · 점검 ${is.done} / ${is.n}` : '');
      const btn = document.getElementById('save-btn');
      if (btn.classList.contains('saving')) return;
      const n = dirty.size, idt = iDirty();
      btn.className = 'save' + (n || weatherDirty || idt ? ' has' : '');
      btn.textContent = adminMode ? '✓ 항목 구성 저장' : (n ? `저장 (${n}개 변경${idt ? ' + 점검' : ''})` : idt ? '저장 (점검)' : (weatherDirty ? '저장 (날씨)' : '저장'));
    }

    const addDaysStr = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    async function saveDay() {
      if (adminMode) return saveStructure();
      const btn = document.getElementById('save-btn');
      if (!dirty.size && !weatherDirty && !iDirty()) { toast('바뀐 값이 없습니다'); return; }
      const needNote = irec ? INSP_ITEMS.filter(i => (irec.results[i.id] === 'Ⅹ' || irec.results[i.id] === '△') && !(irec.notes[i.id] || '').trim()) : [];
      if (needNote.length && !confirm(`Ⅹ·△ 점검 ${needNote.length}개에 비고가 비어 있습니다 (${needNote.map(i => i.equipment).join(', ')}). 그대로 저장할까요?`)) return;
      const patch = {};
      for (const id of dirty) {
        const v = values[id];
        if (v === '' || v === undefined) patch[id] = null;
        else if (isNaN(Number(v))) { toast('숫자가 아닌 값이 있습니다'); return; }
        else patch[id] = Number(v);
      }
      const num = id => { const x = document.getElementById(id).value; return x === '' ? null : Number(x); };
      btn.classList.add('saving'); btn.textContent = '저장 중...';
      if (iDirty()) { // 설비점검일지 같이 저장
        const notes = Object.fromEntries(Object.entries(irec.notes).filter(([, v]) => v && v.trim()));
        const ir = await sb.from('insp_daily').upsert({ d: curDate, results: irec.results, notes, remark: irec.remark, inspector: irec.inspector }, { onConflict: 'd' });
        if (ir.error) { btn.classList.remove('saving'); btn.textContent = '저장 실패 — 다시 누르기'; toast('⚠ 점검 저장 실패: ' + errMsg(ir.error)); return; }
        irec.notes = notes; isaved = JSON.parse(JSON.stringify(irec));
      }
      if (!dirty.size && !weatherDirty) { btn.classList.remove('saving'); btn.className = 'save done'; btn.textContent = '✓ 저장 완료'; toast(`${curDate.slice(5).replace('-', '/')} 점검 저장됨`); setTimeout(renderFooter, 1800); renderTabs(); renderContent(); return; }
      const { data, error } = await sb.rpc('meter_save', {
        p_d: curDate, p_weather: document.getElementById('w-sel').value, p_tmin: num('t-min'), p_tmax: num('t-max'), p_patch: patch
      });
      btn.classList.remove('saving');
      if (error) { btn.textContent = '저장 실패 — 다시 누르기'; toast('⚠ ' + errMsg(error)); return; }
      if (!DAYS[curDate]) { SORTED_DAYS.push(curDate); SORTED_DAYS.sort(); }
      DAYS[curDate] = data;
      dirty = new Set(); weatherDirty = false;
      btn.className = 'save done'; btn.textContent = '✓ 저장 완료';
      let filledMsg = '';
      if (Object.keys(patch).some(id => Portal.FILL_METERS.includes(id) && patch[id] !== null)) {
        try {
          const f = await Portal.fillMeterGaps(addDaysStr(curDate, -7), curDate);
          f.forEach(x => { DAYS[x.d] = DAYS[x.d] || { d: x.d, v: {} }; DAYS[x.d].v = { ...(DAYS[x.d].v || {}), [x.id]: x.v }; if (!SORTED_DAYS.includes(x.d)) { SORTED_DAYS.push(x.d); SORTED_DAYS.sort(); } });
          const dd = [...new Set(f.map(x => x.d))];
          if (dd.length) filledMsg = ` · 쉬는 날 ${dd.map(x => x.slice(8).replace(/^0/, '') + '일').join(',')} 빈칸 채움`;
        } catch (e) { console.warn('빈칸 채우기 실패', e); }
      }
      toast(`${curDate.slice(5).replace('-', '/')} 저장됨${filledMsg}`);
      setTimeout(() => { renderFooter(); }, 1800);
      renderTabs(); renderContent();
    }

    // ---------------- 관리자: 항목 구성 ----------------
    function toggleAdmin() {
      if (!isAdmin()) return;
      if (!adminMode && (dirty.size || weatherDirty) && !confirm('저장하지 않은 검침값이 있습니다. 항목 관리로 넘어갈까요? (입력값은 유지됩니다)')) return;
      adminMode = !adminMode;
      const b = document.getElementById('admin-btn');
      b.classList.toggle('on', adminMode);
      b.textContent = adminMode ? '✕ 닫기' : '⚙ 항목';
      if (!adminMode) { buildTabsFromEdit(); }
      renderTabs(); renderContent(); renderFooter();
    }
    let EDIT = null; // 관리 중인 구성 사본
    function ensureEdit() { if (!EDIT) EDIT = JSON.parse(JSON.stringify(TABS)); }
    function buildTabsFromEdit() { EDIT = null; buildTabs(); }

    function renderAdmin() {
      ensureEdit();
      const t = EDIT[activeTab];
      const c = document.getElementById('content');
      if (!t) { c.innerHTML = '<div class="loading">탭이 없습니다. 위의 ＋ 탭을 누르세요.</div>'; return; }
      const secOpts = EDIT.flatMap((tt, ti) => tt.sections.map((s, si) => `<option value="${ti}|${si}">${esc(tt.name)} › ${esc(s.name)}</option>`)).join('');
      let h = `<div class="adm"><b style="color:var(--blue);font-size:12px">탭 이름</b>
        <input type="text" value="${esc(t.name)}" style="flex:1" onchange="EDIT[${activeTab}].name=this.value;renderTabsAdmin()">
        <button class="mini blue" onclick="moveTab(-1)">◀</button><button class="mini blue" onclick="moveTab(1)">▶</button></div>`;
      t.sections.forEach((s, si) => {
        h += `<div class="adm" style="background:#fff;margin-top:6px">
          <input type="text" value="${esc(s.name)}" style="flex:1;font-weight:700;font-size:13px" onchange="EDIT[${activeTab}].sections[${si}].name=this.value">
          <button class="mini" onclick="moveSec(${si},-1)">▲</button><button class="mini" onclick="moveSec(${si},1)">▼</button></div>`;
        s.fields.forEach((f, fi) => {
          h += `<div class="acard">
            <div>
              <input type="text" class="nm" value="${esc(f.name)}" onchange="EDIT[${activeTab}].sections[${si}].fields[${fi}].name=this.value">
              <div class="row">단위 <input type="text" style="width:54px" value="${esc(f.unit)}" onchange="EDIT[${activeTab}].sections[${si}].fields[${fi}].unit=this.value">
                기준값 <input type="number" step="any" style="width:64px" value="${f.std_value ?? ''}" onchange="EDIT[${activeTab}].sections[${si}].fields[${fi}].std_value=this.value===''?null:Number(this.value)">
                <label><input type="checkbox" ${f.cumulative ? 'checked' : ''} onchange="EDIT[${activeTab}].sections[${si}].fields[${fi}].cumulative=this.checked"> 누적지침</label>
              </div>
              <div class="row">이동 <select onchange="moveField(${si},${fi},this.value)"><option value="">현재 위치</option>${secOpts}</select>
                <span style="color:var(--hint)">ID: ${esc(f.id)}</span></div>
            </div>
            <div class="btns"><button class="mini" onclick="moveFld(${si},${fi},-1)">▲</button><button class="mini" onclick="moveFld(${si},${fi},1)">▼</button>
              <button class="mini red" onclick="delFld(${si},${fi})">삭제</button></div>
          </div>`;
        });
        h += `<div class="addrow"><input id="nf-${si}" placeholder="새 항목 이름"><input class="u" id="nu-${si}" placeholder="단위"><button onclick="addFld(${si})">＋ 항목</button></div>`;
      });
      h += `<div class="addrow" style="margin-top:10px"><input id="new-sec" placeholder="새 섹션 이름"><button onclick="addSec()">＋ 섹션</button></div>`;
      h += `<div style="font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6">· 삭제한 항목은 화면에서만 사라지고 예전 기록은 남습니다.<br>· 누적지침: 계량기처럼 계속 늘어나는 값. 전날보다 작으면 경고하고 사용량을 보여줍니다.<br>· 항목이 하나도 없는 섹션·탭은 저장되지 않습니다.<br>· 다 고친 뒤 아래 <b>항목 구성 저장</b>을 누르세요.</div>`;
      c.innerHTML = h;
    }
    function renderTabsAdmin() {
      document.getElementById('tabs').innerHTML = EDIT.map((t, i) => `<div class="tab ${i === activeTab ? 'active' : ''}" onclick="activeTab=${i};renderTabsAdmin();renderAdmin()">${esc(t.name)}</div>`).join('') + `<div class="tab" onclick="addTab()">＋ 탭</div>`;
    }
    const origRenderTabs = renderTabs;
    renderTabs = function () { if (adminMode) { ensureEdit(); renderTabsAdmin(); } else origRenderTabs(); };
    function swap(a, i, j) { if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; }
    function moveTab(d) { swap(EDIT, activeTab, activeTab + d); if (EDIT[activeTab + d]) activeTab += d; renderTabsAdmin(); renderAdmin(); }
    function moveSec(si, d) { swap(EDIT[activeTab].sections, si, si + d); renderAdmin(); }
    function moveFld(si, fi, d) { swap(EDIT[activeTab].sections[si].fields, fi, fi + d); renderAdmin(); }
    function moveField(si, fi, target) {
      if (!target) return;
      const [ti, tsi] = target.split('|').map(Number);
      const f = EDIT[activeTab].sections[si].fields.splice(fi, 1)[0];
      EDIT[ti].sections[tsi].fields.push(f);
      toast(`"${f.name}" → ${EDIT[ti].name} › ${EDIT[ti].sections[tsi].name}`);
      renderAdmin();
    }
    function delFld(si, fi) {
      const f = EDIT[activeTab].sections[si].fields[fi];
      if (!confirm(`"${f.name}" 항목을 삭제할까요? (예전 기록은 남습니다)`)) return;
      EDIT[activeTab].sections[si].fields.splice(fi, 1);
      (window._deleted = window._deleted || []).push(f.id);
      renderAdmin();
    }
    function addFld(si) {
      const n = document.getElementById('nf-' + si).value.trim(); if (!n) return;
      const u = document.getElementById('nu-' + si).value.trim();
      EDIT[activeTab].sections[si].fields.push({ id: 'f' + Date.now().toString(36), name: n, unit: u, std_value: null, cumulative: false, active: true, _new: true });
      renderAdmin();
    }
    function addSec() {
      const n = document.getElementById('new-sec').value.trim(); if (!n) return;
      EDIT[activeTab].sections.push({ name: n, fields: [] }); renderAdmin();
    }
    function addTab() {
      ensureEdit();
      const n = prompt('새 탭 이름'); if (!n) return;
      EDIT.push({ name: n.trim(), sections: [{ name: '기본', fields: [] }] }); activeTab = EDIT.length - 1; renderTabsAdmin(); renderAdmin();
    }

    async function saveStructure() {
      const btn = document.getElementById('save-btn');
      const rows = []; let sort = 10;
      EDIT.forEach(t => t.sections.forEach(s => s.fields.forEach(f => {
        rows.push({ id: f.id, tab: t.name.trim() || '탭', section: s.name.trim() || '섹션', name: f.name.trim() || '(이름 없음)', unit: f.unit || '', sort, std_value: f.std_value ?? null, cumulative: !!f.cumulative, active: true });
        sort += 10;
      })));
      const ids = new Set(rows.map(r => r.id));
      const deleted = (window._deleted || []).filter(id => !ids.has(id));
      btn.classList.add('saving'); btn.textContent = '저장 중...';
      try {
        const up = await sb.from('meter_fields').upsert(rows, { onConflict: 'id' });
        if (up.error) throw up.error;
        if (deleted.length) { const dl = await sb.from('meter_fields').update({ active: false }).in('id', deleted); if (dl.error) throw dl.error; }
        window._deleted = [];
        const f = await fetchAll('meter_fields', '*', 'sort');
        ALLFIELDS = f; FIELDS = f.filter(x => x.active);
        EDIT = null; buildTabs(); ensureEdit();
        btn.classList.remove('saving'); btn.className = 'save done'; btn.textContent = '✓ 항목 구성 저장됨';
        toast('항목 구성을 저장했습니다');
        setTimeout(renderFooter, 1500);
        renderTabs(); renderAdmin();
      } catch (e) {
        btn.classList.remove('saving'); btn.textContent = '저장 실패 — 다시 누르기'; toast('⚠ ' + errMsg(e));
      }
    }

    // ---------------- 시작 ----------------
    window.addEventListener('beforeunload', e => { if (dirty.size || weatherDirty || iDirty()) { e.preventDefault(); e.returnValue = ''; } });
    Portal.start({
      appId: 'meter',
      title: '설비검침',
      onReady: async P => {
        sb = P.sb; me = P.me;
        document.getElementById('admin-btn').hidden = !isAdmin();
        try { await loadAll(); loadDay(); }
        catch (e) { document.getElementById('content').innerHTML = `<div class="loading">불러오기 실패: ${esc(errMsg(e))}<br>Supabase에 9번·10번 SQL을 실행했는지 확인해 주세요.</div>`; }
      }
    });
  </script>
</body>
</html>
