<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>업무일지</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="../config.js"></script>
  <script src="../common.js"></script>
  <style>
    :root { --primary: #1a1a1a; --bg: #f5f5f5; --card: #fff; --border: #e0e0e0; --text: #1a1a1a; --muted: #888;
      --teal: #1D9E75; --teal-bg: #E1F5EE; --amber: #BA7517; --amber-bg: #FAEEDA; --red: #A32D2D; --red-bg: #FCEBEB; --blue: #185FA5; --blue-bg: #E6F1FB; --radius: 12px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    [hidden] { display: none !important; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 0 12px; }
    .head { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 0; position: sticky; top: 0; z-index: 10; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title { font-size: 17px; font-weight: 700; }
    .vtabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .vtab { font-size: 13px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--muted); cursor: pointer; }
    .vtab.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .vtab .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; margin-left: 4px; }
    .content { padding: 12px 0 60px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
    .form .r { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .form input, .form textarea, .form select { font-size: 15px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; background: #fff; font-family: inherit; }
    .form .ti { flex: 1; min-width: 200px; font-weight: 600; }
    .form textarea { width: 100%; resize: vertical; }
    .form label.l { font-size: 12px; color: #555; font-weight: 600; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chip { font-size: 12px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); cursor: pointer; color: #444; }
    .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .chip.sh.on { background: var(--teal); border-color: var(--teal); }
    .btn { padding: 10px 18px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn.blue { background: var(--blue); } .btn.sec { background: #fff; color: #333; border: 1px solid var(--border); }
    .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; font-weight: 600; }
    .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .bar input[type=search] { font-size: 13px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 16px; min-width: 160px; flex: 1; max-width: 260px; }
    .hint { font-size: 12px; color: var(--muted); }
    .grp { font-size: 13px; font-weight: 700; color: #444; margin: 8px 2px 0; display: flex; gap: 6px; align-items: center; }
    .grp.red { color: var(--red); }
    .it { display: flex; gap: 10px; align-items: flex-start; }
    .it .ck { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #bbb; background: #fff; flex: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; margin-top: 1px; }
    .it .ck.on { background: var(--teal); border-color: var(--teal); }
    .it .ck:disabled { cursor: default; }
    .it .bd { flex: 1; min-width: 0; }
    .it .tt { font-size: 15px; font-weight: 700; word-break: break-all; }
    .it.done .tt { color: #999; text-decoration: line-through; }
    .it .tx { font-size: 13px; color: #444; margin-top: 4px; white-space: pre-wrap; word-break: break-all; }
    .it .mt { font-size: 12px; color: var(--muted); margin-top: 5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .tag { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: #f0f0f0; color: #555; }
    .tag.sh { background: var(--teal-bg); color: var(--teal); }
    .tag.hold { background: #eee; color: #777; }
    .dd { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 9px; background: var(--blue-bg); color: var(--blue); }
    .dd.soon { background: var(--amber-bg); color: var(--amber); } .dd.over { background: var(--red); color: #fff; } .dd.ok { background: var(--teal-bg); color: var(--teal); }
    .acts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .card.over { border-color: var(--red); }
    .empty, .loading { padding: 30px; text-align: center; color: var(--muted); font-size: 14px; }
    .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 80; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app" hidden>
    <div class="head"><div class="wrap head-row">
      <div class="title">📝 업무일지</div>
      <div class="vtabs">
        <button class="vtab on" data-v="mine">내 일지 <span class="n" id="n-mine" hidden></span></button>
        <button class="vtab" data-v="shared">시설 공유 <span class="n" id="n-sh" hidden></span></button>
      </div>
    </div></div>
    <div class="wrap content" id="body"><div class="loading">불러오는 중...</div></div>
    <div class="toast" id="toast"></div>
  </div>
<script>
const esc = Portal.esc;
let sb = null, me = null, view = 'mine', L = [], F = null, EDIT = null;
let mFilter = 'open', mSort = 'date', mQ = '', sFilter = 'open', sWho = '', sQ = '';
const p2 = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('sv-SE');
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
const dayDiff = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5);
const wk = s => '일월화수목금토'[new Date(s + 'T00:00:00').getDay()];
const md = s => `${Number(s.slice(5, 7))}/${Number(s.slice(8))}(${wk(s)})`;
const canWrite = () => Portal.me && ['admin', 'user'].includes(Portal.me.role);
const errMsg = e => (e && (e.message || e.error_description)) || String(e);
const mine = r => Portal.me && r.owner === Portal.me.id;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
const blank = () => ({ d: today(), title: '', body: '', cat: '', due: '', shared: false, status: '진행' });

async function load() {
  let out = [];
  for (let o = 0; o < 20; o++) { const { data, error } = await sb.from('work_log').select('*').order('d', { ascending: false }).order('id', { ascending: false }).range(o * 1000, o * 1000 + 999); if (error) throw error; out = out.concat(data || []); if (!data || data.length < 1000) break; }
  L = out; badges();
}
function badges() {
  const t = today(), my = L.filter(r => mine(r) && r.status === '진행' && r.due && r.due <= t).length, sh = L.filter(r => r.shared && r.status === '진행' && r.due && r.due < t).length;
  const a = document.getElementById('n-mine'), b = document.getElementById('n-sh'); a.textContent = my; a.hidden = !my; a.title = '마감 오늘·지남'; b.textContent = sh; b.hidden = !sh; b.title = '공유 중 마감 지남';
  if (Portal.navBadges) Portal.navBadges();
}
function ddTag(r) {
  if (!r.due) return '';
  if (r.status === '완료') { const late = r.done_at && r.done_at.slice(0, 10) > r.due; return `<span class="dd ${late ? 'soon' : 'ok'}">예정 ${md(r.due)}${late ? ' · 늦게 완료' : ''}</span>`; }
  const n = dayDiff(r.due, today());
  return n < 0 ? `<span class="dd over">${-n}일 지남 (${md(r.due)})</span>` : n === 0 ? '<span class="dd over">오늘까지</span>' : `<span class="dd ${n <= 3 ? 'soon' : ''}">D-${n} · ${md(r.due)}</span>`;
}

// ---------------- 입력 칸 ----------------
function formHtml() {
  const X = EDIT || F || (F = blank()), cats = [...new Set(L.filter(mine).map(r => r.cat).filter(Boolean))];
  const dueChips = [['오늘', today()], ['내일', addDays(today(), 1)], ['이번 주 금', (() => { const d = new Date(); const k = (5 - d.getDay() + 7) % 7; return addDays(today(), k); })()], ['다음 주', addDays(today(), 7)], ['한 달', addDays(today(), 30)]];
  return `<div class="card form" id="frm">
    ${EDIT ? `<div style="margin-bottom:6px"><b>고치기</b> <span class="hint">${md(EDIT.d)} 일지</span></div>` : ''}
    <div class="r"><input type="date" id="f-d" value="${esc(X.d)}" title="업무 날짜"><input class="ti" id="f-title" value="${esc(X.title)}" placeholder="무슨 일? (예: 2번 컴프레셔 오일 교체, 냉동창고 도어 수리 업체 연락)" onkeydown="if(event.key==='Enter'&&!event.isComposing)save()"></div>
    <textarea id="f-body" rows="2" placeholder="내용·진행 상황·메모 (선택)">${esc(X.body)}</textarea>
    <div class="r" style="margin-top:8px"><label class="l">완료 예정일</label><input type="date" id="f-due" value="${esc(X.due || '')}">
      <span class="chips">${dueChips.map(([n, v]) => `<button class="chip" type="button" onclick="document.getElementById('f-due').value='${v}'">${n}</button>`).join('')}<button class="chip" type="button" onclick="document.getElementById('f-due').value=''">없음</button></span></div>
    <div class="r"><label class="l">분류</label><input id="f-cat" list="f-cats" value="${esc(X.cat)}" placeholder="예: 설비 수리, 업체, 보고" style="width:160px"><datalist id="f-cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <button class="chip sh ${X.shared ? 'on' : ''}" type="button" id="f-sh" onclick="this.classList.toggle('on')">🌐 시설 공유 ${X.shared ? '켜짐' : ''}</button>
      <span style="margin-left:auto;display:flex;gap:6px">${EDIT ? '<button class="btn sec" onclick="EDIT=null;render()">취소</button>' : ''}<button class="btn blue" onclick="save()">${EDIT ? '저장' : '+ 적기'}</button></span></div>
    <div class="hint">🌐 시설 공유를 켜면 「시설 공유」 목록에 올라가 시설팀 모두가 봅니다. 끄면 나만 봅니다 (관리자도 못 봄).</div></div>`;
}
function grab() { const X = EDIT || F, v = id => document.getElementById(id); if (!X || !v('f-title')) return; X.d = v('f-d').value || today(); X.title = v('f-title').value.trim(); X.body = v('f-body').value.trim(); X.due = v('f-due').value; X.cat = v('f-cat').value.trim(); X.shared = v('f-sh').classList.contains('on'); }
async function save() {
  grab(); const X = EDIT || F; if (!X.title) { alert('무슨 일인지(제목) 적어 주세요'); document.getElementById('f-title').focus(); return; }
  const row = { d: X.d, title: X.title, body: X.body, cat: X.cat, due: X.due || null, shared: !!X.shared, updated_at: new Date().toISOString() };
  try {
    if (EDIT) { const { error } = await sb.from('work_log').update(row).eq('id', EDIT.id); if (error) throw error; }
    else { row.owner_name = (me && (me.name || me.username)) || ''; row.owner = Portal.me.id; const { error } = await sb.from('work_log').insert(row); if (error) throw error; }
    const was = !!EDIT; EDIT = null; F = null; await load(); toast(was ? '고쳤습니다' : '적었습니다'); render();
  } catch (e) { alert('저장 실패: ' + errMsg(e) + '\n(35번 SQL을 실행했는지 확인)'); }
}

// ---------------- 한 줄 ----------------
function itemHtml(r, showOwner) {
  const my = mine(r) && canWrite(), done = r.status === '완료', t = today(), over = r.status === '진행' && r.due && r.due < t;
  return `<div class="card ${over ? 'over' : ''}"><div class="it ${done ? 'done' : ''}">
    <button class="ck ${done ? 'on' : ''}" ${my ? `onclick="toggleDone(${r.id})" title="${done ? '완료 취소' : '완료로 표시'}"` : 'disabled'}>${done ? '✓' : ''}</button>
    <div class="bd"><div class="tt">${esc(r.title)}</div>${r.body ? `<div class="tx">${esc(r.body)}</div>` : ''}
      <div class="mt">${showOwner ? `<b style="color:#333">${esc(r.owner_name || '')}</b>` : ''}<span>${md(r.d)}</span>${r.cat ? `<span class="tag">${esc(r.cat)}</span>` : ''}${ddTag(r)}
        ${r.status === '보류' ? '<span class="tag hold">⏸ 보류</span>' : ''}${!showOwner && r.shared ? '<span class="tag sh">🌐 공유 중</span>' : ''}${done && r.done_at ? `<span>완료 ${md(r.done_at.slice(0, 10))}</span>` : ''}</div>
      ${my ? `<div class="acts"><button class="btn sm sec" onclick="editIt(${r.id})">고치기</button><button class="btn sm sec" onclick="toggleShare(${r.id})">${r.shared ? '🌐 공유 끄기' : '🌐 시설 공유'}</button>
        ${r.status !== '완료' ? `<button class="btn sm sec" onclick="setStatus(${r.id},'${r.status === '보류' ? '진행' : '보류'}')">${r.status === '보류' ? '▶ 다시 진행' : '⏸ 보류'}</button>` : ''}
        <button class="btn sm sec" style="color:var(--red)" onclick="delIt(${r.id})">삭제</button></div>` : ''}
    </div></div></div>`;
}
async function patch(id, p, msg) { p.updated_at = new Date().toISOString(); const { error } = await sb.from('work_log').update(p).eq('id', id); if (error) { alert('저장 실패: ' + errMsg(error)); return; } await load(); if (msg) toast(msg); render(); }
function toggleDone(id) { const r = L.find(x => x.id === id); if (!r) return; patch(id, r.status === '완료' ? { status: '진행', done_at: null } : { status: '완료', done_at: new Date().toISOString() }, r.status === '완료' ? '다시 진행으로' : '완료 ✓'); }
function setStatus(id, s) { patch(id, { status: s, done_at: null }, s === '보류' ? '보류로 바꿨습니다' : '다시 진행'); }
function toggleShare(id) { const r = L.find(x => x.id === id); if (!r) return; patch(id, { shared: !r.shared }, r.shared ? '공유를 껐습니다 (나만 봄)' : '시설 공유에 올렸습니다'); }
function editIt(id) { const r = L.find(x => x.id === id); if (!r) return; grab(); EDIT = { id, d: r.d, title: r.title, body: r.body, cat: r.cat, due: r.due || '', shared: r.shared }; view = 'mine'; tabs(); render(); window.scrollTo(0, 0); document.getElementById('f-title').focus(); }
async function delIt(id) { const r = L.find(x => x.id === id); if (!r || !confirm(`「${r.title}」을(를) 지울까요?`)) return; const { error } = await sb.from('work_log').delete().eq('id', id); if (error) { alert('삭제 실패: ' + errMsg(error)); return; } await load(); toast('지웠습니다'); render(); }

// ---------------- 목록 ----------------
const matchQ = (r, q) => !q || (r.title + ' ' + r.body + ' ' + r.cat + ' ' + (r.owner_name || '')).toLowerCase().includes(q.toLowerCase());
function groupHtml(A, showOwner) {
  const t = today(), open = A.filter(r => r.status !== '완료');
  if (mSort === 'due' || showOwner) { // 예정일 순: 지남 → 오늘 → 이번 주 → 나중 → 예정일 없음 → 보류 → 완료
    const g = [['⚠ 마감 지남', r => r.status === '진행' && r.due && r.due < t, 'red'], ['오늘까지', r => r.status === '진행' && r.due === t, 'red'], ['7일 안', r => r.status === '진행' && r.due && r.due > t && r.due <= addDays(t, 7)],
      ['그 뒤', r => r.status === '진행' && r.due && r.due > addDays(t, 7)], ['예정일 없음', r => r.status === '진행' && !r.due], ['⏸ 보류', r => r.status === '보류'], ['✓ 완료', r => r.status === '완료']];
    return g.map(([n, f, c]) => { const X = A.filter(f).sort((a, b) => n === '✓ 완료' ? ((a.done_at || '') < (b.done_at || '') ? 1 : -1) : ((a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : a.d < b.d ? 1 : -1));
      return X.length ? `<div class="grp ${c || ''}">${n} <span class="hint">${X.length}</span></div>` + X.map(r => itemHtml(r, showOwner)).join('') : ''; }).join('');
  }
  const ds = [...new Set(A.map(r => r.d))].sort().reverse(); // 날짜별 일지
  return ds.map(d => `<div class="grp">${d === t ? '오늘 · ' : d === addDays(t, -1) ? '어제 · ' : ''}${d.slice(0, 4)}. ${md(d)}</div>` + A.filter(r => r.d === d).map(r => itemHtml(r, showOwner)).join('')).join('');
}
function renderMine() {
  const el = document.getElementById('body');
  if (!canWrite()) { view = 'shared'; tabs(); return renderShared(); }
  const my = L.filter(mine), t = today();
  const A = my.filter(r => (mFilter === 'open' ? r.status !== '완료' : mFilter === 'done' ? r.status === '완료' : true) && matchQ(r, mQ));
  const nOver = my.filter(r => r.status === '진행' && r.due && r.due < t).length, nToday = my.filter(r => r.status === '진행' && r.due === t).length, nOpen = my.filter(r => r.status !== '완료').length;
  el.innerHTML = formHtml() +
    `<div class="bar"><span class="chips">${[['open', `진행 중 ${nOpen}`], ['done', '완료'], ['all', '전체']].map(([k, n]) => `<button class="chip ${mFilter === k ? 'on' : ''}" onclick="grab();mFilter='${k}';render()">${n}</button>`).join('')}</span>
      <span class="chips" style="margin-left:6px">${[['date', '📅 날짜별 일지'], ['due', '⏰ 예정일 순']].map(([k, n]) => `<button class="chip ${mSort === k ? 'on' : ''}" onclick="grab();mSort='${k}';render()">${n}</button>`).join('')}</span>
      <input type="search" placeholder="찾기" value="${esc(mQ)}" oninput="mQ=this.value;grab();renderList()" style="margin-left:auto"></div>
    ${nOver || nToday ? `<div class="hint" style="color:var(--red)">⚠ ${nOver ? `마감 지난 일 ${nOver}건` : ''}${nOver && nToday ? ' · ' : ''}${nToday ? `오늘까지 ${nToday}건` : ''}</div>` : ''}
    <div id="lst">${A.length ? groupHtml(A, false) : `<div class="empty">${mFilter === 'open' ? '진행 중인 일이 없습니다 👍' : '기록이 없습니다'}</div>`}</div>`;
}
function renderList() { const A = L.filter(mine).filter(r => (mFilter === 'open' ? r.status !== '완료' : mFilter === 'done' ? r.status === '완료' : true) && matchQ(r, mQ)); document.getElementById('lst').innerHTML = A.length ? groupHtml(A, false) : '<div class="empty">찾는 기록이 없습니다</div>'; }
function renderShared() {
  const el = document.getElementById('body'), S = L.filter(r => r.shared), who = [...new Set(S.map(r => r.owner_name || '?'))].sort();
  const A = S.filter(r => (sFilter === 'open' ? r.status !== '완료' : sFilter === 'done' ? r.status === '완료' : true) && (!sWho || (r.owner_name || '?') === sWho) && matchQ(r, sQ));
  el.innerHTML = `<div class="hint">시설팀이 「🌐 시설 공유」로 올린 일만 보입니다 · 마감 지난 것 → 오늘 → 예정일 가까운 순 · 고치기·완료 표시는 쓴 사람만</div>
    <div class="bar"><span class="chips">${[['open', '진행 중'], ['done', '완료'], ['all', '전체']].map(([k, n]) => `<button class="chip ${sFilter === k ? 'on' : ''}" onclick="sFilter='${k}';render()">${n}</button>`).join('')}</span>
      <span class="chips" style="margin-left:6px"><button class="chip ${!sWho ? 'on' : ''}" onclick="sWho='';render()">모두</button>${who.map(w => `<button class="chip ${sWho === w ? 'on' : ''}" onclick="sWho=${JSON.stringify(w).replace(/"/g, '&quot;')};render()">${esc(w)} <span class="hint">${S.filter(r => (r.owner_name || '?') === w && r.status !== '완료').length}</span></button>`).join('')}</span>
      <input type="search" placeholder="찾기" value="${esc(sQ)}" oninput="sQ=this.value;renderSharedList()" style="margin-left:auto"></div>
    <div id="slst">${A.length ? groupHtml(A, true) : '<div class="empty">공유된 일이 없습니다.</div>'}</div>`;
}
function renderSharedList() { const S = L.filter(r => r.shared), A = S.filter(r => (sFilter === 'open' ? r.status !== '완료' : sFilter === 'done' ? r.status === '완료' : true) && (!sWho || (r.owner_name || '?') === sWho) && matchQ(r, sQ)); document.getElementById('slst').innerHTML = A.length ? groupHtml(A, true) : '<div class="empty">찾는 기록이 없습니다</div>'; }

function tabs() { document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('on', b.dataset.v === view)); }
function render() { if (view === 'mine') renderMine(); else renderShared(); }
document.querySelectorAll('.vtab').forEach(b => b.addEventListener('click', () => { grab(); view = b.dataset.v; tabs(); render(); }));

Portal.start({
  appId: 'log',
  title: '업무일지',
  onReady: async P => {
    sb = P.sb; me = P.me; document.getElementById('app').hidden = false;
    try { await load(); } catch (e) { document.getElementById('body').innerHTML = `<div class="empty">불러오기 실패: ${esc(errMsg(e))}<br>Supabase에 35번 SQL(35_work_log.sql)을 실행했는지 확인해 주세요.</div>`; return; }
    if (!canWrite() || new URLSearchParams(location.search).has('shared')) view = 'shared';
    tabs(); render();
  }
});
</script>
