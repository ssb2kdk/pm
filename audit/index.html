<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>변경 기록</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="../config.js"></script>
  <script src="../common.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif; background: #f5f6f8; color: #1a1a1a; margin: 0; }
    [hidden] { display: none !important; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 14px; }
    h2 { margin: 6px 0 10px; font-size: 19px; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
    .tool { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tool select, .tool input { font-size: 13px; padding: 6px; border: 1px solid #d0d5dc; border-radius: 6px; }
    .chip { font-size: 12px; padding: 5px 10px; border: 1px solid #d0d5dc; border-radius: 16px; background: #fff; cursor: pointer; }
    .chip.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .btn { background: #2c5aa0; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .hint { font-size: 12px; color: #888; line-height: 1.6; }
    .ev { border-bottom: 1px solid #eef0f3; padding: 9px 2px; }
    .ev:last-child { border-bottom: none; }
    .ev .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .ev .when { color: #555; font-variant-numeric: tabular-nums; }
    .ev .who { font-weight: 700; }
    .tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; }
    .t-UPDATE { background: #fff4e0; color: #8a5a00; } .t-DELETE { background: #fdecea; color: #b3261e; } .t-INSERT { background: #e8f5ee; color: #1d7a50; }
    .app { color: #2c5aa0; font-weight: 600; } .key { color: #333; }
    table.d { border-collapse: collapse; margin: 6px 0 0 4px; font-size: 12px; }
    table.d td { padding: 3px 8px; border-bottom: 1px solid #f1f2f4; vertical-align: top; }
    table.d td.f { color: #555; white-space: nowrap; } table.d td.o { color: #b3261e; text-decoration: line-through; } table.d td.n { color: #1d6b3a; font-weight: 600; }
    table.d td.k { font-size: 11px; white-space: nowrap; }
    .k-수정 { color: #8a5a00; font-weight: 700; } .k-지움 { color: #b3261e; font-weight: 700; } .k-새로 { color: #1d7a50; }
    .more { font-size: 12px; color: #2c5aa0; cursor: pointer; margin-left: 4px; }
    .empty { text-align: center; color: #888; padding: 30px 0; }
    .loading { text-align: center; color: #888; padding: 30px 0; }
  </style>
</head>
<body>
  <div id="app" hidden>
    <div class="wrap">
      <h2>🕘 변경 기록 <span class="hint">값이 새로 들어가거나 바뀌거나 지워질 때마다 데이터베이스가 자동으로 남긴 기록 (관리자만 볼 수 있고, 누구도 고치거나 지울 수 없음)</span></h2>
      <div class="card">
        <div class="tool">
          기간 <input type="date" id="f-from"> ~ <input type="date" id="f-to">
          <select id="f-tbl"><option value="">모든 앱</option></select>
          <select id="f-who"><option value="">모든 사람</option></select>
          <input id="f-q" placeholder="날짜·항목·값 검색" style="width:160px">
          <button class="btn" onclick="load()">보기</button>
        </div>
        <div class="tool" style="margin-top:8px">
          <span class="chips" id="f-kind"></span>
          <span class="hint" id="st"></span>
        </div>
      </div>
      <div class="card" id="list"><div class="loading">불러오는 중...</div></div>
    </div>
  </div>
  <script>
    let sb = null, me = null, LOG = [], FIELDS = {}, kind = 'change';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pad = n => String(n).padStart(2, '0'), ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const TBL = {
      meter_daily: '설비검침', meter_fields: '설비검침 항목', ww_daily: '환경일지 (다온산업 장부·폐수일지)', air_daily: '대기일지',
      insp_daily: '설비점검일지', insp_items: '설비점검 항목', ut_monthly: '유틸리티 (월간입력·목표·특이사항)', ut_daily: '유틸리티 일일',
      env_settings: '환경일지 (설정·수질측정·폐수장 특이사항)', hook_breakers: '후크메타 차단기', hook_readings: '후크메타 측정값', hook_panels: '후크메타 분전반', hook_photos: '후크메타 사진',
      pm_items: '예방정비 항목', pm_logs: '예방정비 완료 기록', pm_settings: '예방정비 설정', profiles: '사용자 계정'
    };
    const SKIP = new Set(['updated_at', 'updated_by', 'created_at', 'created_by']);
    const KINDS = [['change', '수정·삭제만'], ['all', '새로 입력 포함 전체']];
    // JSON → { '경로': 값 } (배열·객체 안까지)
    function flat(v, p, out) {
      if (v === null || v === undefined || typeof v !== 'object') { if (p) out[p] = v; return out; }
      if (Array.isArray(v)) { if (!v.length && p) out[p] = '[]'; v.forEach((x, i) => flat(x, `${p}[${i}]`, out)); return out; }
      const ks = Object.keys(v); if (!ks.length && p) out[p] = '{}';
      ks.forEach(k => { if (!p && SKIP.has(k)) return; flat(v[k], p ? `${p}.${k}` : k, out); }); return out;
    }
    const isEmpty = v => v === null || v === undefined || v === '' || v === '[]' || v === '{}';
    function diff(e) {
      const o = flat(e.old_v, '', {}), n = flat(e.new_v, '', {}), keys = [...new Set([...Object.keys(o), ...Object.keys(n)])].sort(), out = [];
      keys.forEach(k => { const a = o[k], b = n[k]; if (JSON.stringify(a) === JSON.stringify(b)) return;
        out.push({ k, a, b, kind: isEmpty(a) ? '새로' : isEmpty(b) ? '지움' : '수정' }); });
      return out;
    }
    function label(e, k) {
      if (e.tbl === 'meter_daily' && /^v\./.test(k)) { const id = k.slice(2).split(/[.[]/)[0]; const f = FIELDS[id]; return f ? `${f}${k.slice(2 + id.length)}` : k; }
      return k.replace(/^data\./, '').replace(/^value\./, '');
    }
    const show = v => v === null || v === undefined ? '(빈칸)' : typeof v === 'string' ? (v.length > 80 ? v.slice(0, 80) + '…' : v) : JSON.stringify(v);
    async function load() {
      const from = document.getElementById('f-from').value, to = document.getElementById('f-to').value, tbl = document.getElementById('f-tbl').value;
      document.getElementById('list').innerHTML = '<div class="loading">불러오는 중...</div>';
      LOG = [];
      try {
        for (let i = 0; i < 20; i++) {
          let q = sb.from('audit_log').select('*').gte('at', from + 'T00:00:00+09:00').lte('at', to + 'T23:59:59+09:00').order('at', { ascending: false }).range(i * 1000, i * 1000 + 999);
          if (tbl) q = q.eq('tbl', tbl);
          const { data, error } = await q; if (error) throw error; LOG.push(...data); if (data.length < 1000) break;
        }
      } catch (e) { document.getElementById('list').innerHTML = `<div class="empty">불러오지 못했습니다: ${esc(e.message || e)}<br>Supabase에 21번 SQL(21_audit_log.sql)을 실행했는지 확인해 주세요.</div>`; return; }
      const who = [...new Set(LOG.map(e => e.user_name || '(알 수 없음)'))].sort(), sel = document.getElementById('f-who'), cur = sel.value;
      sel.innerHTML = '<option value="">모든 사람</option>' + who.map(w => `<option ${w === cur ? 'selected' : ''}>${esc(w)}</option>`).join('');
      render();
    }
    function render() {
      const w = document.getElementById('f-who').value, q = document.getElementById('f-q').value.trim().toLowerCase();
      document.getElementById('f-kind').innerHTML = KINDS.map(([k, n]) => `<button class="chip ${kind === k ? 'on' : ''}" onclick="kind='${k}';render()">${n}</button>`).join('');
      let n = 0, h = '';
      LOG.forEach(e => {
        if (w && (e.user_name || '(알 수 없음)') !== w) return;
        let ds = diff(e); if (!ds.length && e.op !== 'DELETE') return;
        if (kind === 'change') { if (e.op === 'INSERT') return; if (e.op === 'UPDATE') { ds = ds.filter(x => x.kind !== '새로'); if (!ds.length) return; } }
        const app = TBL[e.tbl] || e.tbl, ob = e.new_v || e.old_v || {}, key = ob.name && e.tbl !== 'meter_fields' ? `${ob.panel ? ob.panel + ' · ' : ''}${ob.name}` : ob.task ? `${ob.equipment ? ob.equipment + ' · ' : ''}${ob.task}` : e.row_key;
        if (q && !(`${app} ${key} ${ds.map(x => label(e, x.k) + ' ' + show(x.a) + ' ' + show(x.b)).join(' ')}`.toLowerCase().includes(q))) return;
        n++;
        const t = new Date(e.at), when = `${ymd(t)} ${pad(t.getHours())}:${pad(t.getMinutes())}`;
        const lim = 15, id = 'ev' + e.id;
        h += `<div class="ev"><div class="hd"><span class="when">${when}</span><span class="who">${esc(e.user_name || '(알 수 없음)')}</span>
          <span class="tag t-${e.op}">${{ INSERT: '새로 입력', UPDATE: '수정', DELETE: '삭제' }[e.op]}</span><span class="app">${esc(app)}</span><span class="key">${esc(key)}</span>
          ${e.op === 'UPDATE' ? `<span class="hint">· ${ds.filter(x => x.kind === '수정').length}칸 수정${ds.some(x => x.kind === '지움') ? ` · ${ds.filter(x => x.kind === '지움').length}칸 지움` : ''}${ds.some(x => x.kind === '새로') ? ` · ${ds.filter(x => x.kind === '새로').length}칸 새로 입력` : ''}</span>` : ''}</div>
          <table class="d" id="${id}">${ds.map((x, i) => `<tr ${i >= lim ? 'hidden' : ''}><td class="k k-${x.kind}">${x.kind === '새로' ? '새로 입력' : x.kind}</td><td class="f">${esc(label(e, x.k))}</td><td class="o">${x.kind === '새로' ? '' : esc(show(x.a))}</td><td>→</td><td class="n">${x.kind === '지움' ? '(빈칸)' : esc(show(x.b))}</td></tr>`).join('')}</table>
          ${ds.length > lim ? `<span class="more" onclick="document.querySelectorAll('#${id} tr[hidden]').forEach(r=>r.hidden=false);this.remove()">+ ${ds.length - lim}칸 더 보기</span>` : ''}</div>`;
      });
      document.getElementById('list').innerHTML = h || '<div class="empty">이 조건에 맞는 기록이 없습니다.</div>';
      document.getElementById('st').textContent = `${n}건 (불러온 기록 ${LOG.length}건)`;
    }
    Portal.start({
      appId: 'audit', title: '변경 기록',
      onReady: async P => {
        sb = P.sb; me = P.me;
        if (!Portal.isAdmin()) { document.getElementById('list').innerHTML = '<div class="empty">관리자만 볼 수 있습니다.</div>'; return; }
        const t = new Date(), f = new Date(); f.setDate(f.getDate() - 30);
        document.getElementById('f-from').value = ymd(f); document.getElementById('f-to').value = ymd(t);
        document.getElementById('f-tbl').innerHTML = '<option value="">모든 앱</option>' + Object.entries(TBL).map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
        document.getElementById('f-who').onchange = render; document.getElementById('f-q').oninput = render;
        try { const { data } = await sb.from('meter_fields').select('id, name'); (data || []).forEach(r => { FIELDS[r.id] = r.name; }); } catch (e) { }
        load();
      }
    });
  </script>
</body>
</html>
