<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>자재·스페어 관리</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="../config.js"></script>
  <script src="../common.js"></script>
  <style>
    :root { --bg: #f5f5f5; --card: #fff; --border: #e0e0e0; --muted: #888; --primary: #1a1a1a;
      --teal: #1D9E75; --teal-bg: #E1F5EE; --amber: #BA7517; --amber-bg: #FAEEDA; --red: #A32D2D; --red-bg: #FCEBEB; --blue: #185FA5; --blue-bg: #E6F1FB; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Segoe UI', sans-serif; background: var(--bg); color: #1a1a1a; margin: 0; font-size: 14px; }
    [hidden] { display: none !important; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 12px; }
    .head { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 0; position: sticky; top: 0; z-index: 10; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .title { font-size: 17px; font-weight: 700; }
    .vtabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .vtab { font-size: 13px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: #555; cursor: pointer; text-decoration: none; }
    .vtab.on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .vtab .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; margin-left: 4px; text-align: center; }
    .content { padding: 12px 0 60px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .bar input[type=search] { flex: 1; min-width: 180px; font-size: 15px; padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px; }
    select, input, textarea { font-family: inherit; }
    .bar select { font-size: 14px; padding: 8px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
    .btn { padding: 9px 14px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn.sec { background: #fff; color: #333; border: 1px solid var(--border); } .btn.blue { background: var(--blue); } .btn.teal { background: var(--teal); } .btn.red { background: #fff; color: var(--red); border: 1px solid var(--red); }
    .btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
    .chip { font-size: 12.5px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 16px; background: #fff; cursor: pointer; color: #444; }
    .chip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
    .hint { font-size: 12px; color: var(--muted); }
    .sum { display: flex; gap: 10px; flex-wrap: wrap; }
    .sum div { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 120px; } .sum b { font-size: 18px; display: block; } .sum .warn b { color: var(--red); }
    .tw { overflow-x: auto; }
    table.t { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }
    table.t th, table.t td { border-bottom: 1px solid #eee; padding: 7px 8px; text-align: center; vertical-align: middle; }
    table.t th { background: #f6f8fb; font-size: 12px; color: #555; font-weight: 600; position: sticky; top: 0; }
    table.t td.l { text-align: left; } table.t tr.it { cursor: pointer; } table.t tr.it:hover td { background: #f8fbff; }
    table.t td.r { text-align: right; }
    .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #eee; border: 1px solid var(--border); display: block; }
    .st { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .st.low { background: var(--red); color: #fff; } .st.ok { background: var(--teal-bg); color: var(--teal); } .st.zero { background: var(--red-bg); color: var(--red); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; } @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    .f { display: flex; flex-direction: column; gap: 3px; margin-bottom: 9px; } .f label { font-size: 12px; color: #666; font-weight: 600; }
    .f input, .f textarea, .f select { font-size: 15px; padding: 8px 9px; border: 1px solid var(--border); border-radius: 8px; width: 100%; background: #fff; }
    .f input:disabled, .f textarea:disabled { background: #fafafa; color: #333; }
    .sec-t { color: #d4452a; font-weight: 700; font-size: 14px; margin: 4px 0 10px; }
    .stock { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .stock div { background: #f8f9fb; border-radius: 10px; padding: 10px; } .stock b { font-size: 20px; display: block; } .stock .need b { color: var(--red); }
    .phs { display: flex; gap: 8px; flex-wrap: wrap; }
    .phs .pw { position: relative; } .phs img { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; background: #eee; }
    .phs .x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 11px; border: none; background: #000a; color: #fff; cursor: pointer; }
    .phs label.add { width: 96px; height: 96px; border-radius: 8px; border: 2px dashed #bbb; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; } .phs label.add b { font-size: 24px; }
    .mv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 700px) { .mv { grid-template-columns: 1fr; } }
    .mvf { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: #f6f8fb; padding: 8px; border-radius: 10px; margin-bottom: 10px; }
    .mvf input { font-size: 15px; padding: 7px 8px; border: 1px solid var(--border); border-radius: 8px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; } .seg button { border: none; background: #fff; padding: 7px 14px; font-size: 14px; cursor: pointer; font-weight: 700; } .seg button.on.in { background: var(--blue); color: #fff; } .seg button.on.out { background: var(--amber); color: #fff; }
    textarea.imp { width: 100%; min-height: 140px; font-family: monospace; font-size: 12px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
    .empty, .loading { padding: 30px; text-align: center; color: var(--muted); }
    .lb { position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 70; display: flex; align-items: center; justify-content: center; }
    .lb img { max-width: 96vw; max-height: 86vh; border-radius: 6px; } .lb .c { position: absolute; top: 12px; right: 16px; color: #fff; font-size: 28px; background: none; border: none; cursor: pointer; }
    .lb .nv { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 34px; background: none; border: none; cursor: pointer; padding: 10px; }
    .qsrch { width: 100%; font-size: 17px; padding: 12px; border: 2px solid var(--blue); border-radius: 12px; }
    .qi { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    .qi .qn { flex: 1; min-width: 0; } .qi .qn b { font-size: 15px; } .qi .qn .hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qi .qst { text-align: center; min-width: 54px; font-size: 11px; color: var(--muted); } .qi .qst b { display: block; font-size: 18px; color: #1a1a1a; } .qi .qst.low b { color: var(--red); }
    .qb { border: none; border-radius: 10px; font-size: 15px; font-weight: 700; padding: 14px 12px; cursor: pointer; color: #fff; } .qb.out { background: var(--amber); } .qb.in { background: var(--blue); }
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 18px 18px 0 0; padding: 16px 16px 24px; z-index: 61; max-width: 560px; margin: 0 auto; box-shadow: 0 -4px 20px #0003; }
    .step { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 14px 0; }
    .step button { width: 56px; height: 56px; border-radius: 28px; border: 1px solid var(--border); background: #f4f4f4; font-size: 26px; cursor: pointer; }
    .step input { width: 110px; text-align: center; font-size: 28px; font-weight: 700; padding: 8px; border: 2px solid var(--border); border-radius: 12px; }
    .ok-big { width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; color: #fff; cursor: pointer; }
    .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 80; } .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app" hidden>
    <div class="head"><div class="wrap head-row">
      <div class="title">📦 자재·스페어 관리</div>
      <div class="vtabs">
        <button class="vtab" id="tb-quick" onclick="setView('quick')">⚡ 빠른 입출고</button><button class="vtab" id="tb-list" onclick="setView('list')">🔧 스페어 재고 관리</button>
        <a class="vtab" href="../mat/">🛒 자재 발주 요청 <span class="n" id="n-mat" hidden>0</span></a>
      </div>
    </div></div>
    <div class="wrap content" id="body"><div class="loading">불러오는 중...</div></div>
    <div class="toast" id="toast"></div>
    <div class="lb" id="lb" hidden onclick="if(event.target===this)lbClose()"><button class="c" onclick="lbClose()">✕</button><button class="nv" style="left:8px" onclick="lbGo(-1)">‹</button><img id="lb-img"><button class="nv" style="right:8px" onclick="lbGo(1)">›</button></div>
  </div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let view = (window.innerWidth < 760 ? 'quick' : 'list'), qq = '', QS = null, sb = null, me = null, ITEMS = [], MOVES = [], URLS = {}, sel = null, draft = null, q = '', fPlace = '', fLow = false, mvKind = '입고', showImp = false, loadErr = '', LB = null;
const BUCKET = 'pm-photos', UNITS = ['EA', '세트', '개', 'm', '롤', '박스', 'kg', 'L'];
const p2 = n => String(n).padStart(2, '0'), todayStr = (() => { const d = new Date(); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; })();
const num = v => v === null || v === undefined || v === '' || isNaN(Number(String(v).replace(/,/g, ''))) ? null : Number(String(v).replace(/,/g, ''));
const nf = v => v === null || v === undefined || isNaN(v) ? '-' : Number(v).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
const errMsg = e => (e && (e.message || e.error_description)) || String(e);
const isAdmin = () => me && me.role === 'admin', canWrite = () => me && ['admin', 'user'].includes(me.role), myName = () => (me && (me.name || me.username)) || '';
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

// ---------------- 불러오기 ----------------
async function fetchAll(qf) { const out = []; for (let f = 0; ; f += 1000) { const { data, error } = await qf().range(f, f + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out; }
async function loadAll() {
  loadErr = '';
  try { ITEMS = await fetchAll(() => sb.from('spare_items').select('*').order('id')); ITEMS.sort(byCode); MOVES = await fetchAll(() => sb.from('spare_moves').select('*').order('d').order('id')); }
  catch (e) { ITEMS = []; MOVES = []; loadErr = errMsg(e); }
  await signUrls(ITEMS.map(i => (i.photos || [])[0]).filter(Boolean));
  try { const { data } = await sb.from('mat_req').select('id').in('status', ['요청', '확인']); const n = (data || []).length, b = document.getElementById('n-mat'); b.textContent = n; b.hidden = !n; } catch (e) { }
}
async function signUrls(paths) {
  const need = [...new Set(paths)].filter(p => p && !URLS[p]); if (!need.length) return;
  try { const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 60 * 60 * 6); (data || []).forEach(x => { if (x.signedUrl) URLS[x.path] = x.signedUrl; }); } catch (e) { }
}
// 재고 = 입고 합 − 출고 합
function stockOf(id) { let s = 0; MOVES.forEach(m => { if (m.item_id === id) s += m.kind === '입고' ? Number(m.qty) : -Number(m.qty); }); return s; }
function needOf(it) { const sf = num(it.safety); if (sf === null) return null; return sf - stockOf(it.id); }
const stTag = it => { const s = stockOf(it.id), n = needOf(it); return s <= 0 ? '<span class="st zero">재고 없음</span>' : n !== null && n > 0 ? '<span class="st low">부족</span>' : '<span class="st ok">정상</span>'; };

// ---------------- 목록 ----------------
function go(id) { if (draft && draft._dirty && !confirm('저장하지 않은 내용이 있습니다. 버리고 이동할까요?')) return; sel = id; draft = null; render(); window.scrollTo(0, 0); }
function setView(v) { if (draft && draft._dirty && !confirm('저장하지 않은 내용이 있습니다. 버리고 이동할까요?')) return; view = v; sel = null; draft = null; render(); window.scrollTo(0, 0); }
function render() { ['quick', 'list'].forEach(v => { const b = document.getElementById('tb-' + v); if (b) b.classList.toggle('on', view === v); }); if (loadErr) return renderErr(); if (sel !== null) return renderItem(); view === 'quick' ? renderQuick() : renderList(); }

// ---------------- 자재코드 자동 부여 ----------------
// 규칙: 자재코드 = 분류 두 글자 + '-' + 번호 (예: BR-1, BR-2 … BR-1000) · 번호는 그 분류에서 지금까지 쓴 가장 큰 번호 + 1 (지운 번호는 다시 안 씀)
// 분류는 code1 칸에, 자재코드는 code2 칸에 저장 · 정렬은 분류 순서 → 번호 크기 순 (앞에 0을 안 붙여도 1,2,…,10 순서로 나옴)
const CATS = [['BR', '베어링'], ['MT', '모터·감속기'], ['BT', '벨트·체인·스프로킷'], ['SL', '씰·패킹·오링'], ['PN', '공압'], ['VL', '밸브·배관'], ['EL', '전기·제어'], ['PU', '펌프 부품'], ['FT', '필터'], ['HT', '히터·온도'], ['PK', '포장기 전용 부품'], ['ET', '기타']];
const catName = c => (CATS.find(x => x[0] === c) || [, ''])[1], catOf = v => { const t = String(v || '').trim(); if (!t) return 'ET'; const f = CATS.find(x => x[0] === t.toUpperCase() || x[1] === t || x[1].split('·').includes(t)); return f ? f[0] : 'ET'; };
function nextCode2(cat) { cat = cat || 'ET'; let mx = 0; const re = new RegExp('^' + cat + '-(\\d+)$', 'i'); ITEMS.forEach(i => { const m = re.exec(String(i.code2 || '').trim()); if (m) mx = Math.max(mx, +m[1]); }); return cat + '-' + (mx + 1); }
const codeKey = i => { const m = /^([A-Z]+)-(\d+)$/i.exec(String(i.code2 || '')); const ci = CATS.findIndex(x => x[0] === (m ? m[1].toUpperCase() : i.code1)); return [ci < 0 ? 99 : ci, m ? +m[2] : 1e9, String(i.code2 || '')]; };
const byCode = (a, b) => { const x = codeKey(a), y = codeKey(b); return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2], 'ko', { numeric: true }); };
const hay = i => [i.name, i.spec, i.code2, i.old_code, catName(i.code1), i.equipment, i.place, i.rack, i.note].join(' ').toLowerCase();
let fCat = '';

// ---------------- 빠른 입출고 (현장용) ----------------
function recentIds() { try { return JSON.parse(localStorage.getItem('spare_recent') || '[]'); } catch (e) { return []; } }
function pushRecent(id) { try { const r = recentIds().filter(x => x !== id); r.unshift(id); localStorage.setItem('spare_recent', JSON.stringify(r.slice(0, 20))); } catch (e) { } }
function renderQuick() {
  document.getElementById('body').innerHTML = `<div class="card" style="position:sticky;top:58px;z-index:5"><input type="search" class="qsrch" id="qsrch" placeholder="🔍 품목명 · 규격 · 자재코드(BR-3) · 랙" value="${esc(qq)}" oninput="qq=this.value;renderQuickBody()">
    <div class="hint" style="margin-top:6px">품목 옆 <b style="color:var(--amber)">출고</b>·<b style="color:var(--blue)">입고</b>를 누르고 수량만 확인하면 끝 · 랙에 붙인 QR을 폰 카메라로 찍으면 그 품목이 바로 열립니다</div></div><div id="qbody" style="display:flex;flex-direction:column;gap:8px"></div>`;
  renderQuickBody();
}
function renderQuickBody() {
  const el = document.getElementById('qbody'); if (!el) return;
  const k = qq.trim().toLowerCase(), R = recentIds();
  let L = ITEMS.filter(i => i.active !== false && (!k || hay(i).includes(k)));
  const ri = id => { const x = R.indexOf(id); return x < 0 ? 999 : x; };
  L.sort((a, b) => k ? 0 : ri(a.id) - ri(b.id) || byCode(a, b));
  const more = L.length > 50; L = L.slice(0, 50);
  el.innerHTML = (!k && R.length ? '<div class="hint">최근 쓴 품목이 위에 나옵니다</div>' : '') + (L.map(i => { const s = stockOf(i.id), n = needOf(i), low = s <= 0 || (n !== null && n > 0);
    return `<div class="qi"><div class="qn" onclick="${canWrite() ? `qOpen(${i.id},'출고')` : `go(${i.id})`}"><b>${esc(i.name)}</b><div class="hint">${esc(i.code2 || '')}${i.spec ? ' · ' + esc(i.spec) : ''}</div><div class="hint">${esc(i.place || '')}${i.rack ? ' · ' + esc(i.rack) : ''}</div></div>
      <div class="qst ${low ? 'low' : ''}">재고<b>${nf(s)}</b>${esc(i.unit || '')}</div>${canWrite() ? `<button class="qb out" onclick="qOpen(${i.id},'출고')">출고</button><button class="qb in" onclick="qOpen(${i.id},'입고')">입고</button>` : ''}</div>`; }).join('') || `<div class="empty">${ITEMS.length ? '찾는 품목이 없습니다' : '등록된 품목이 없습니다'}</div>`) + (more ? '<div class="hint" style="text-align:center">50개까지만 보입니다 — 검색어를 더 넣어 주세요</div>' : '');
}
function qOpen(id, kind) { const it = ITEMS.find(i => i.id === id); if (!it) return; QS = { id, kind, qty: 1, memo: '' }; qRender(); setTimeout(() => { const x = document.getElementById('qs-q'); if (x) x.select(); }, 50); }
function qClose() { QS = null; const e = document.getElementById('qsheet'); if (e) e.remove(); }
function qRender() {
  let e = document.getElementById('qsheet'); if (!e) { e = document.createElement('div'); e.id = 'qsheet'; document.getElementById('app').appendChild(e); }
  const it = ITEMS.find(i => i.id === QS.id), s = stockOf(it.id), after = s + (QS.kind === '입고' ? 1 : -1) * (num(QS.qty) || 0), out = QS.kind === '출고';
  const eqs = [...new Set(String(it.equipment || '').split(/[,/·]/).map(x => x.trim()).filter(Boolean))];
  e.innerHTML = `<div class="sheet-bg" onclick="qClose()"></div><div class="sheet">
    <div style="display:flex;justify-content:space-between;gap:8px"><div><div style="font-size:18px;font-weight:700">${esc(it.name)}</div><div class="hint">${esc(it.code2 || '')}${it.spec ? ' · ' + esc(it.spec) : ''} · ${esc(it.place || '')}${it.rack ? ' ' + esc(it.rack) : ''}</div></div><button class="btn sec sm" onclick="qClose()">✕</button></div>
    <div style="text-align:center;margin-top:12px"><span class="seg"><button class="out ${out ? 'on' : ''}" onclick="QS.kind='출고';qRender()">출고 (꺼내 씀)</button><button class="in ${out ? '' : 'on'}" onclick="QS.kind='입고';qRender()">입고 (들어옴)</button></span></div>
    <div class="step"><button onclick="QS.qty=Math.max(1,(num(QS.qty)||0)-1);qRender()">−</button><input id="qs-q" inputmode="decimal" value="${esc(QS.qty)}" oninput="QS.qty=this.value;qAfter()"><button onclick="QS.qty=(num(QS.qty)||0)+1;qRender()">＋</button></div>
    <div style="text-align:center;font-size:14px" id="qs-after">재고 ${nf(s)} → <b style="color:${after < 0 ? 'var(--red)' : '#1a1a1a'}">${nf(after)}</b> ${esc(it.unit || '')}</div>

  const c2 = String(D.code2 || '').trim(); if (ITEMS.some(i => i.id !== D.id && String(i.code2 || '').trim().toLowerCase() === c2.toLowerCase())) { if (D._new && confirm(`자재코드 ${c2}는 이미 쓰고 있습니다. 다음 번호 ${nextCode2(D.code1)}로 바꿀까요?`)) { D.code2 = nextCode2(D.code1); } else { alert(`자재코드 ${c2}는 이미 다른 품목이 쓰고 있습니다.`); return; } }
  const photos = (D.photos || []).slice();
  try {
    for (const x of D.files || []) { const d = new Date(), path = `spare/${d.getFullYear()}/${p2(d.getMonth() + 1)}/${crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random().toString(36).slice(2)}.jpg`;
      const up = await sb.storage.from(BUCKET).upload(path, await compressImage(x.f), { contentType: 'image/jpeg', upsert: false }); if (up.error) throw up.error; photos.push(path); }
  } catch (e) { alert('사진 올리기 실패: ' + errMsg(e)); return; }
  const row = { name: D.name.trim(), code1: D.code1, code2: String(D.code2 || '').trim(), old_code: String(D.old_code || '').trim(), spec: D.spec || '', place: D.place || '', rack: D.rack || '', equipment: D.equipment || '', unit: D.unit || 'EA', price: num(D.price), safety: num(D.safety), note: D.note || '', photos, updated_at: new Date().toISOString() };
  const qq = D._new ? sb.from('spare_items').insert(row).select().single() : sb.from('spare_items').update(row).eq('id', D.id).select().single();
  const { data, error } = await qq; if (error) { alert('저장 실패: ' + errMsg(error)); return; }
  const out = Array.isArray(data) ? data[0] : data; ITEMS = ITEMS.filter(i => i.id !== out.id).concat([out]).sort(byCode); await signUrls(out.photos || []);
  sel = out.id; draft = null; toast('저장했습니다'); render();
}
async function delItem() {
  const it = ITEMS.find(i => i.id === sel); if (!it || !confirm(`「${it.name}」 품목과 입출고 기록을 모두 지울까요?\n(쓰지 않게 됐을 뿐이면 지우지 말고 비고에 적어 두세요)`)) return;
  const { error } = await sb.from('spare_items').delete().eq('id', it.id); if (error) { alert('삭제 실패: ' + errMsg(error)); return; }
  try { if ((it.photos || []).length) await sb.storage.from(BUCKET).remove(it.photos); } catch (e) { }
  ITEMS = ITEMS.filter(i => i.id !== it.id); MOVES = MOVES.filter(m => m.item_id !== it.id); sel = null; draft = null; render();
}
async function addMove(id) {
  const d = document.getElementById('mv-d').value, qv = num(document.getElementById('mv-q').value), memo = document.getElementById('mv-m').value.trim();
  if (!d || !qv || qv <= 0) { alert('날짜와 수량을 넣어 주세요.'); return; }
  if (mvKind === '출고' && qv > stockOf(id) && !confirm(`재고(${nf(stockOf(id))})보다 많이 출고합니다. 그래도 적을까요?`)) return;
  const { data, error } = await sb.from('spare_moves').insert({ item_id: id, d, kind: mvKind, qty: qv, memo, by_name: myName() }).select().single();
  if (error) { alert('저장 실패: ' + errMsg(error)); return; }
  MOVES.push(Array.isArray(data) ? data[0] : data); toast(`${mvKind} ${nf(qv)} 기록`); render();
}
async function delMove(mid) { if (!confirm('이 입출고 기록을 지울까요?')) return; const { error } = await sb.from('spare_moves').delete().eq('id', mid); if (error) { alert('삭제 실패: ' + errMsg(error)); return; } MOVES = MOVES.filter(m => m.id !== mid); render(); }
async function lbOpen(i) { const L = draft.photos || []; await signUrls(L); LB = { L, i }; document.getElementById('lb').hidden = false; lbShow(); }
function lbShow() { document.getElementById('lb-img').src = URLS[LB.L[LB.i]] || ''; }
function lbGo(d) { if (!LB) return; LB.i = (LB.i + d + LB.L.length) % LB.L.length; lbShow(); }
function lbClose() { document.getElementById('lb').hidden = true; LB = null; }

// ---------------- 엑셀 붙여넣기 · 내려받기 ----------------
const IMP_COLS = ['분류', '기존 코드', '품목명', '규격', '보관 장소', '랙 번호', '단위', '단가', '안전 재고', '현재 재고', '사용 설비', '비고'];
function impHtml() {
  return `<div style="margin-top:10px;border-top:1px dashed #ddd;padding-top:10px"><b>회사 프로그램 목록 옮기기</b><div class="hint">엑셀에서 아래 순서로 칸을 맞춰 복사해 붙여넣으세요 (제목 줄은 자동으로 건너뜀 · 뒤쪽 칸은 비워도 됨)<br><b>${IMP_COLS.join(' · ')}</b><br>「현재 재고」를 넣으면 오늘 날짜로 「기초 재고 (옮겨옴)」 입고가 같이 들어갑니다 · <b>분류</b>는 BR·EL 같은 두 글자나 「베어링」 같은 이름 (비우거나 모르는 분류면 「기타」) → 자재코드는 분류별 번호가 자동으로 붙음 · 같은 기존 코드(없으면 같은 품목명·규격)가 이미 있으면 건너뜀<br>분류: ${CATS.map(c => c[0] + ' ' + c[1]).join(' · ')}</div>
    <textarea class="imp" id="imp-t" placeholder="PK\tS052\tbottom open pad\t9-rb0024-11-01\t외포장실\ta1\tEA\t3500\t10\t90"></textarea><div class="bar" style="margin-top:6px"><button class="btn" onclick="impRun()">등록</button><span class="hint" id="imp-st"></span></div></div>`;
}
async function impRun() {
  const lines = document.getElementById('imp-t').value.split(/\r?\n/).map(l => l.split(l.includes('\t') ? '\t' : /\s*[|,]\s*/).map(x => x.trim())).filter(c => c.some(Boolean));
  const rows = lines.filter(c => !(c.join(' ').includes('품목명') && c.join(' ').includes('규격'))).filter(c => (c[2] || '').trim());
  if (!rows.length) { alert('붙여넣은 내용에서 품목을 찾지 못했습니다. 3번째 칸이 품목명이어야 합니다.'); return; }
  const st = document.getElementById('imp-st'); let ok = 0, skip = 0, fail = [];
  for (const c of rows) {
    if (ITEMS.some(i => c[1] ? (i.old_code || '') === c[1] : i.name === c[2] && (i.spec || '') === (c[3] || ''))) { skip++; continue; }
    const cat = catOf(c[0]);
    const row = { code1: cat, code2: nextCode2(cat), old_code: c[1] || '', name: c[2], spec: c[3] || '', place: c[4] || '', rack: c[5] || '', unit: c[6] || 'EA', price: num(c[7]), safety: num(c[8]), equipment: c[10] || '', note: c[11] || '', photos: [] };
    const { data, error } = await sb.from('spare_items').insert(row).select().single(); if (error) { fail.push(`${c[2]}: ${errMsg(error)}`); continue; }
    const it = Array.isArray(data) ? data[0] : data; ITEMS.push(it); ok++; st.textContent = `등록 중... ${ok}/${rows.length}`;
    const s0 = num(c[9]); if (s0 && s0 > 0) { const r = await sb.from('spare_moves').insert({ item_id: it.id, d: todayStr, kind: '입고', qty: s0, memo: '기초 재고 (옮겨옴)', by_name: myName() }).select().single(); if (!r.error) MOVES.push(Array.isArray(r.data) ? r.data[0] : r.data); }
  }
  toast(`${ok}개 등록${skip ? ` · 이미 있는 ${skip}개 건너뜀` : ''}`); if (fail.length) alert('등록 못 한 품목:\n' + fail.join('\n'));
  showImp = false; ITEMS.sort(byCode); render();
}
async function exportXlsx() {
  if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const a1 = [['분류', '자재코드', '번호', '기존 코드', '품목명', '규격', '사용 설비', '보관 장소', '랙 번호', '단위', '단가', '안전 재고', '재고 수량', '재고 금액', '발주 필요', '비고']];
  ITEMS.filter(i => i.active !== false).sort(byCode).forEach(i => { const s = stockOf(i.id), n = needOf(i); a1.push([catName(i.code1), i.code2, (/-(\d+)$/.exec(i.code2 || '') || [])[1] ? +(/-(\d+)$/.exec(i.code2))[1] : '', i.old_code || '', i.name, i.spec, i.equipment, i.place, i.rack, i.unit, num(i.price), num(i.safety), s, Math.round(Math.max(0, s) * (num(i.price) || 0)), n !== null && n > 0 ? n : '', i.note]); });
  const a2 = [['품목명', '자재코드', '일자', '구분', '수량', '메모', '적은 사람']]; MOVES.forEach(m => { const i = ITEMS.find(x => x.id === m.item_id); if (i) a2.push([i.name, i.code2, m.d, m.kind, Number(m.qty), m.memo, m.by_name]); });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a1), '스페어 재고'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a2), '입출고 기록'); XLSX.writeFile(wb, `스페어재고_${todayStr}.xlsx`);
}

  appId: 'mat',
  title: '자재·스페어 관리',
  onReady: async P => { sb = P.sb; me = P.me; await loadAll();
    const qp = new URLSearchParams(location.search).get('q');
    if (qp) { const it = ITEMS.find(i => String(i.code2 || '').toLowerCase() === qp.toLowerCase() || '#' + i.id === qp) || ITEMS.find(i => i.old_code && i.old_code.toLowerCase() === qp.toLowerCase()); view = 'quick'; if (it) { qq = it.code2 || it.name; pushRecent(it.id); } history.replaceState(null, '', location.pathname); render(); if (it && canWrite()) qOpen(it.id, '출고'); else if (!it) toast('QR의 품목을 찾지 못했습니다: ' + qp); return; }
    render(); }
});
